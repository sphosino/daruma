<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>だるまさんがころんだ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Mochiy+Pop+One&display=swap">
<style>
/* だるま役も子ども役も同じ画面。上に「だるまさんがころんだ」、まん中に道（横から見た図）、下に役ごとの操作。
   決まりは rules.js（old/daruma-core.js の上に今の決まりを足したもの）。見た目は前の子ども役の試作（proto-kids.html）と同じ */
:root{
  --bg:#fff7ec; --card:#fffdf9; --ink:#4a2f22; --muted:#8f6b58; --line:#f1dcc6;
  --accent:#c2601a; --on:#ffe2bd; --red:#d8452f; --ground:#e9d2b0; --sky:#fff1dc;
  --ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --pop:"Mochiy Pop One","Zen Maru Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#231a15; --card:#2f241d; --ink:#f6e6d6; --muted:#c3a58f; --line:#4a382c;
  --accent:#f0954a; --on:#5a3a1f; --red:#ff6a52; --ground:#4a3a2c; --sky:#2a201a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#231a15; --card:#2f241d; --ink:#f6e6d6; --muted:#c3a58f; --line:#4a382c;
  --accent:#f0954a; --on:#5a3a1f; --red:#ff6a52; --ground:#4a3a2c; --sky:#2a201a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-weight:500;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;gap:8px}
h1{font-family:var(--pop);font-size:1.05rem;margin:0;font-weight:400;flex:1 1 auto;min-width:0}
.chant{font-family:var(--pop);font-size:clamp(1.3rem,6vw,2rem);text-align:center;letter-spacing:.06em;min-height:1.4em;white-space:nowrap}
.chant span{color:var(--line)}.chant span.said{color:var(--ink)}.chant.look{color:var(--red)}
.stage{position:relative;flex:0 0 auto;height:clamp(160px,52vw,300px);border-radius:16px;overflow:hidden;background:var(--sky);border:2px solid var(--line)}
canvas{display:block;width:100%;height:100%}
.msg{position:absolute;left:50%;top:10%;transform:translateX(-50%);width:94%;text-align:center;font-family:var(--pop);font-size:clamp(1.3rem,6.5vw,2.2rem);line-height:1.2;color:var(--red);text-shadow:0 2px 0 var(--card);pointer-events:none}
.msg small{display:block;font-size:.55em;color:var(--ink)}
.paused{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:.8rem;font-weight:700;color:var(--muted);pointer-events:none}
.hud{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hud b{color:var(--ink)}
.pill{white-space:nowrap;font:inherit;font-weight:700;font-size:.85rem;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.pill[aria-expanded="true"],.pill.on{background:var(--on);border-color:var(--accent)}
.pill:focus-visible,.btn:focus-visible,.pad:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* 子ども役：大きなパッド */
.pad{flex:1 1 auto;min-height:130px;max-height:340px;border-radius:20px;border:3px solid var(--accent);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  touch-action:none;cursor:pointer;font-family:var(--pop);font-size:1.3rem;color:var(--accent);position:relative;overflow:hidden}
.pad small{font-family:var(--ui);font-weight:700;font-size:.8rem;color:var(--muted)}
.pad.down{background:var(--on)}
.gauge{position:absolute;left:12px;bottom:0;height:12px;border-radius:6px 6px 0 0;background:var(--accent);width:0}
/* 速さのバー：押した場所（横）が目標の速さ。▼が目標、下の帯がいまの速さ */
.scale{position:absolute;left:12px;right:12px;bottom:16px;display:flex;justify-content:space-between;font-family:var(--ui);font-size:.72rem;font-weight:700;color:var(--muted);pointer-events:none}
.target{position:absolute;bottom:0;top:0;width:3px;margin-left:-1.5px;background:var(--accent);opacity:.55;pointer-events:none}
.target::after{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--accent)}
/* だるま役：操作のカード */
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.lbl{font-size:.8rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.row{display:flex;gap:6px}.row>*{flex:1 1 0;min-width:0}
.btn{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 6px;cursor:pointer;line-height:1.3}
.btn small{display:block;font-size:.68rem;font-weight:500;color:var(--muted)}
.btn.on{background:var(--on);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card);font-family:var(--pop);font-weight:400;font-size:1.1rem}
.btn[disabled]{opacity:.45;cursor:default}
.lv{--c:var(--line);position:relative}.lv.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.lv.next{border-style:dashed;border-color:var(--c)}.lv.next::after{content:'予約';position:absolute;top:3px;right:6px;font-size:.65rem;color:var(--c)}
input[type=range]{width:100%;accent-color:var(--accent)}
.arm.on{background:var(--on);border-color:var(--red)}
/* はじめる・終わりの画面 */
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--bg) 86%,transparent);text-align:center;padding:12px;overflow:auto}
.over h2{font-family:var(--pop);font-weight:400;margin:0;font-size:1.5rem}
.over p{margin:0;font-size:.86rem;color:var(--muted);max-width:32em}
.choices{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.go{font:inherit;font-family:var(--pop);font-size:1.15rem;border:0;border-radius:14px;background:var(--accent);color:var(--card);padding:12px 26px;cursor:pointer}
/* 調整（デバッグ） */
/* 画面の上にかぶせて広く出す。開いている間はゲームは中断 */
.tuneWrap{position:fixed;inset:0;z-index:10;background:color-mix(in srgb,var(--ink) 35%,transparent);display:flex;justify-content:center;align-items:flex-start;padding:10px 12px}
.tune{width:100%;max-width:720px;max-height:calc(100dvh - 20px);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;overflow:auto;user-select:text}
.tune>*{flex-shrink:0}
.tuneHead{display:flex;align-items:center;gap:8px}.tuneHead h2{font-family:var(--pop);font-weight:400;font-size:1.05rem;margin:0;flex:1}
.tuneTop{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tuneRows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
@media (max-width:480px){.wide{display:none}h1{font-size:.95rem}}
@media (max-width:480px){.tuneRows{grid-template-columns:minmax(0,1fr)}}
.tuneRows label{display:flex;flex-direction:column;gap:2px;font-size:.78rem;font-weight:700;color:var(--muted)}
.tuneRows label span{display:flex;justify-content:space-between}.tuneRows label b{color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:.78rem;color:var(--muted);margin:0}
.check{font-size:.8rem;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.kidTable{font-size:.74rem;overflow-x:auto}.kidTable table{border-collapse:collapse;width:100%;white-space:nowrap}
.kidTable th,.kidTable td{padding:3px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.kidTable th:first-child,.kidTable td:first-child{text-align:left}.kidTable th{color:var(--muted);font-weight:700}
.bar{display:inline-block;width:44px;height:6px;background:var(--line);border-radius:3px;vertical-align:middle;margin-right:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.tut{flex:0 0 auto;background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:8px 10px;font-size:.84rem;line-height:1.5}
.hl{outline:3px solid var(--accent)!important;outline-offset:3px;animation:hl 1s ease-in-out infinite}
@keyframes hl{50%{outline-color:transparent}}
.tutHold{border-width:3px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.tutTop{display:flex;align-items:center;gap:8px;margin-bottom:2px}.tutTop b{flex:1;font-family:var(--pop);font-weight:400;color:var(--accent)}
.tut p{margin:0}.tut .pill{font-size:.78rem;padding:3px 10px}.tutBtns{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.log{font-size:.76rem;color:var(--muted);max-height:7em;overflow:auto;border-top:1px dashed var(--line);padding-top:6px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>だるまさんがころんだ</h1>
    <button type="button" class="pill" id="helpBtn" aria-label="あそびかた">？<span class="wide"> あそびかた</span></button>
    <button type="button" class="pill" id="pauseBtn" hidden>⏸ 中断</button>
    <button type="button" class="pill" id="tuneBtn" aria-expanded="false">⚙ 調整</button>
  </header>
  <div class="tuneWrap" id="tune" hidden><section class="tune" role="dialog" aria-label="調整">
    <div class="tuneHead"><h2>⚙ 調整</h2><button type="button" class="pill" id="tuneClose">閉じて続ける</button></div>
    <div class="tuneTop">
      <button type="button" class="pill" id="pause2">⏸ 中断</button>
      <button type="button" class="pill" id="quitBtn">やめる</button>
      <label class="check"><input type="checkbox" id="showMind"> 道の上に、子どもの体力と考え・CPU のだるまの考えを出す</label>
      <button type="button" class="pill" id="tuneReset">最初の値に戻す</button>
    </div>
    <div class="kidTable" id="kidTable"></div>
    <div class="tuneRows" id="tuneRows"></div>
    <p class="note">変えた数字はこのブラウザに覚えます。★は次のゲームから効きます。それ以外はすぐ効きます。</p>
    <div class="log" id="log"></div>
  </section></div>
  <div class="chant" id="chant"></div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="paused" id="paused" hidden></div>
    <div class="msg" id="msg" hidden></div>
    <div class="over" id="over">
      <h2 id="overH">だるまさんがころんだ</h2>
      <div class="choices" id="roles"></div>
      <p id="overP"></p>
      <div class="choices" id="types"></div>
      <button class="go" id="startBtn" type="button">はじめる</button>
    </div>
  </div>
  <div class="hud"><span>だるまの時計 のこり <b id="left">40.0</b><span id="sec">秒</span></span><span><b id="cycle">1</b>回目</span><span id="qiBox">気力 <b id="qi">—</b></span></div>

  <div class="tut" id="tut" hidden><div class="tutTop"><b id="tutStep"></b><button type="button" class="pill" id="tutSkip">とばす</button></div><p id="tutText"></p><div class="tutBtns"><button type="button" class="pill on" id="tutNext" hidden>次へ</button></div></div>
  <!-- だるま役の操作 -->
  <div class="card" id="ctlDaruma" hidden>
    <div><div class="lbl"><span>強気度</span><span id="lvNote"></span></div>
      <div class="row" id="lvRow"></div></div>
    <div><div class="lbl"><span>テンポ</span><span id="tempoTxt"></span></div>
      <input type="range" id="tempo" min="0" max="100" step="1" value="45" aria-label="テンポ"></div>
    <div class="row"><button class="btn arm on" id="arm" type="button"></button><button class="btn primary" id="go" type="button">言い始める</button></div>
  </div>
  <!-- 子ども役の操作 -->
  <div class="pad" id="pad" hidden tabindex="0" role="button" aria-label="押した場所の速さで走る">押した場所の速さで走る<small>右ほど速い・押したまま左右に動かせる・離すと止まる</small><div class="scale"><span>歩く</span><span>小走り</span><span>全力</span></div><div class="target" id="target" hidden></div><div class="gauge" id="gauge"></div></div>
</div>
<script src="old/daruma-core.js"></script>
<script src="rules.js"></script>
<script>
'use strict';
const R=window.DarumaRules,Core=R.Core,P=R.P,TIERS=R.TIERS;
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// 強気度の見せ方（2026-10-19）：強気度が高いほど振り向きやすい、の向きで見せる。しくみ（old/daruma-core.js の段階）は
//   そのままで、名前・並び・光だけ逆にしている。中身の low（振り向きが安い・見送りの実入りが少ない）が「激」、max が「低」
const LV_NAME={low:'激',mid:'高',high:'中',max:'低'},LV_ORDER=['max','high','mid','low'];
const TIER_COL={low:'#e0402c',mid:'#ef8a2c',high:'#e5b830',max:'#4f8fd8'},PULSE={low:2.6,mid:1.6,high:1,max:0.6};
const KID_COL=['#4f8fd8','#3aa65a','#b45cc8','#e0457b'];
const TYPE_NOTE={normal:'クセなし。まずはこれで。',red:'気力の器が大きいぶん、見送っても実入りが細い。',oni:'振り向きが安い。そのかわりテンポを上げるのが高い。',attack:'テンポが安い。そのかわり振り向きが高い。'};
const HOW={
  kid:'あなたはオレンジの子。だるまが言っている間だけ進めます。振り向いたときに動いていたら少し下がる。だれか1人でもだるまにタッチしたら子どもの勝ち、だるまの時計（言っている時間だけ進む）が切れたらだるまの勝ち。だるまの強気度（うしろの光）が高いほど、だるまは振り向きやすい。',
  daruma:'あなたはだるま。CPU の子ども4人がタッチしようと走ってきます。言い終わったときに動いていた子を下がらせて、時計が切れるまで耐えたら勝ち。見送ると止まらずに「だ」からそのまま続きます。'};

// ---------- 調整の数字（⚙ 調整で変えられる。変えた値はこのブラウザに覚える） ----------
// 時計・猶予・下がる量は、シミュレーター（sim.js）で決めた値（2026-10-18）。全速まで 2 秒・止まるまで 1 秒にしたので、どちらの役も 46 秒
const TUNE_DEF={accT:2.0,stopT:1.0,cpuAccT:2.0,cpuStopMin:0.8,cpuStopMax:1.4,grace:0.2,clockKid:46,clockDaruma:46,knock:25,breakMin:1.0,breakMax:3.5,cue:0.8,watch:1.2};
const TUNE_INFO=[['accT','あなた：全速になるまで',0.3,3,0.1,'秒'],['stopT','あなた：全速から止まるまで',0.1,2.5,0.05,'秒'],
  ['cpuAccT','★CPU の子：全速になるまで（±15%）',0.3,3,0.1,'秒'],
  ['cpuStopMin','★CPU の子：止まるまで（最短）',0.1,2.5,0.05,'秒'],['cpuStopMax','★CPU の子：止まるまで（最長）',0.1,2.5,0.05,'秒'],
  ['grace','振り向き始めてから見つかるまでの猶予',0,0.5,0.1,'秒'],['clockKid','だるまの時計（子ども役のとき）',20,90,1,'秒'],['clockDaruma','だるまの時計（だるま役のとき）',20,90,1,'秒'],
  ['knock','捕まったら下がる（96でスタートへ）',0,96,1,''],
  ['breakMin','ひと休み（いちばん短い）',0,5,0.1,'秒'],['breakMax','ひと休み（いちばん長い）',0,8,0.1,'秒'],
  ['cue','「すぅ…」の合図',0,2,0.1,'秒前'],['watch','振り向いて見ている時間',0.3,3,0.1,'秒']];
// 前の最初の値（下がる量40）のまま覚えていたら、新しい最初の値にする
const saved=store.get('dk-tune3',{});if(saved.knock===40)delete saved.knock;if(saved.grace===0.1)delete saved.grace;for(const [k,olds] of Object.entries({accT:[0.33,1.5],stopT:[0.5],cpuAccT:[1.5],cpuStopMin:[0.4],cpuStopMax:[0.7]}))if(olds.includes(saved[k]))delete saved[k];if([41,42,44].includes(saved.clockDaruma))delete saved.clockDaruma;if(saved.clockKid===40)delete saved.clockKid;
let T={...TUNE_DEF,...saved};
function applyTune(){R.LOOK.grace=Math.round(T.grace*10);R.LOOK.ticks=Math.max(R.LOOK.grace+1,Math.round(T.watch*10));P.GOAL_TICKS=Math.round((role==='daruma'?T.clockDaruma:T.clockKid)*1000/P.TICK_MS);P.CATCH_KNOCK=T.knock>=96?null:T.knock;if(me)R.setMe(me,T.accT,T.stopT);renderCtl()}

const q=new URLSearchParams(location.search);
let role=q.get('role')||store.get('dk-role','kid');if(role!=='daruma')role='kid';
let pickedType='normal';
let st=null,me=null,cpu=null,phase='setup',paused=false;
// 時間はゲームの中の時計（gt, ミリ秒）で進める。中断している間は止まる
let gt=0,acc=0,lastNow=performance.now(),timers=[],prev=null,prevAt=0,faceAt=-1e9,push=null;
const caughtAt={};
function later(ms,fn){timers.push({at:gt+ms,fn})}

// ---------- 画面の部品 ----------
function renderSetup(){
  $('roles').innerHTML=[['kid','子どもで遊ぶ'],['daruma','だるまで遊ぶ']].map(([k,l])=>`<button class="pill${k===role?' on':''}" data-r="${k}" type="button">${l}</button>`).join('');
  $('roles').querySelectorAll('button').forEach(b=>b.onclick=()=>{role=b.dataset.r;store.set('dk-role',role);renderSetup();if(phase==='setup')$('overP').textContent=HOW[role]});
  $('types').hidden=role!=='daruma';
  $('types').innerHTML=Object.keys(P.DARUMA_TYPES).map(k=>`<button class="pill${k===pickedType?' on':''}" data-t="${k}" type="button" title="${TYPE_NOTE[k]||''}">${P.DARUMA_TYPES[k].label}</button>`).join('');
  $('types').querySelectorAll('button').forEach(b=>b.onclick=()=>{pickedType=b.dataset.t;renderSetup()});
}
function renderCtl(){
  if(!st)return;
  $('sec').hidden=!!tut;$('left').textContent=tut?'練習中':Math.max(0,(P.GOAL_TICKS-st.elapsedTicks)*P.TICK_MS/1000).toFixed(1);$('cycle').textContent=st.cycle;
  $('qiBox').hidden=role!=='daruma';
  if(role!=='daruma')return;
  const prep=phase==='prep';
  $('lvRow').innerHTML=LV_ORDER.map(t=>`<button class="btn lv${st.reward===t?' on':''}${st.nextReward===t?' next':''}" data-r="${t}" style="--c:${TIER_COL[t]}" type="button">${LV_NAME[t]}<small>見送り+${Math.round(P.REWARD[t].reward*st.type.skipRewardScale)}<br>振向−${Math.round(Core.turnCostOf(P,st,t))}</small></button>`).join('');
  const cost=Math.round(Core.turnCostOf(P,st)),afford=st.stamina>=cost;
  $('arm').classList.toggle('on',st.turnArmed);
  $('arm').innerHTML=st.turnArmed&&!afford?`🙈 気力が足りない。見送りになる<small>気力 +${Math.round(Core.currentSkipReward(P,st))}</small>`:st.turnArmed?`👀 言い終わったら振り向く<small>気力 -${cost}</small>`:`🙈 振り向かずに見送る<small>気力 +${Math.round(Core.currentSkipReward(P,st))}</small>`;
  $('go').disabled=!prep||paused;
  $('tempo').value=Math.round(st.tempoValue);$('tempoTxt').textContent=Core.tempoLabel(st.tempoValue)+(phase==='chant'?'（上げると気力を使う）':'');
  $('qi').textContent=`${Math.round(st.stamina)} / ${Math.round(st.staminaMax)}`;
  $('lvNote').textContent=prep?'':st.nextReward?'次の「だ」で変わる':'押すと予約';
}
function renderChant(){const el=$('chant');el.classList.toggle('look',phase==='look'||phase==='push');
  if(phase==='prep'||phase==='cue'){el.innerHTML=`<span class="said">${phase==='cue'?'すぅ…':'ひと休み'}</span>`;return}
  const n=phase==='push'?10:st?R.said(st):0;el.innerHTML=Core.CHANT_CHARS.map((s,k)=>`<span class="${k<n?'said':''}">${s}</span>`).join('')}

  const rows=st.children.map(c=>{
    const e=`<span class="bar"><i style="width:${pc(c.energy/c.energyMax)}%;background:${c.winded?css('--red'):''}"></i></span>${Math.round(c.energy)}/${Math.round(c.energyMax)}${c.winded?' ぜぇ':''}`;
    const mind=gaitOf(c,st.children.indexOf(c))+(c.human||c.intendsToStop!==false?'':'・賭け');
    return `<tr><td>${c.human?'あなた':c.name}</td><td>${e}</td><td>${(c.maxSpeed*10).toFixed(1)}</td><td>${(c.accT/10).toFixed(1)}秒</td><td>${(c.maxSpeed/c.brake/10).toFixed(2)}秒</td>`+
      `<td>${c.human?'—':pc(c.boldness)}</td><td>${c.human?'—':pc(c.selfControl)}</td><td>${c.human?'—':pc(c.reaction)}</td><td>${c.human?'—':pc(c.skepticism)}</td><td>${c.human?'—':MOTIVE_JA[c.motiveName]||c.motiveName}</td><td>${mind}</td><td>${Math.round(c.pos)}</td></tr>`});
  $('kidTable').innerHTML=`<table><tr><th>子ども</th><th>体力</th><th>最高速</th><th>全速まで</th><th>止まるまで</th><th>強気</th><th>自制</th><th>反応</th><th>疑い深さ</th><th>動機</th><th>いま</th><th>位置</th></tr>${rows.join('')}</table>
  <p class="note">体力は走ると減り、ゆっくり・止まっていると戻ります。速さを変える（加速・ブレーキ）だけでも減ります。0になると「ぜぇ」で遅くなり、疲れているほどブレーキも効きにくくなります。あなたも CPU の子と同じです。強気〜疑い深さは 0〜100。</p>`;
}
setInterval(()=>{if(!$('tune').hidden)renderKids()},300);
function renderTune(){
  $('tuneRows').innerHTML=TUNE_INFO.map(([k,n,lo,hi,s,u])=>`<label for="t_${k}"><span>${n}<b id="tv_${k}">${T[k]}${u}</b></span><input type="range" id="t_${k}" min="${lo}" max="${hi}" step="${s}" value="${T[k]}"></label>`).join('');
  TUNE_INFO.forEach(([k,,,,,u])=>{const el=$('t_'+k);el.oninput=()=>{T[k]=+el.value;$('tv_'+k).textContent=T[k]+u;store.set('dk-tune3',T);applyTune()}});
}
// 開くと自動で中断、閉じると（自分で中断していなければ）続きから
let tunePaused=false;
function openTune(){$('tune').hidden=false;renderKids();$('tuneBtn').setAttribute('aria-expanded','true');
  if(st&&!paused&&phase!=='over'&&phase!=='setup'){tunePaused=true;togglePause()}}
function closeTune(){$('tune').hidden=true;$('tuneBtn').setAttribute('aria-expanded','false');if(tunePaused&&paused)togglePause();tunePaused=false}
$('tuneBtn').onclick=()=>$('tune').hidden?openTune():closeTune();
$('tuneClose').onclick=closeTune;
$('tune').addEventListener('click',e=>{if(e.target===$('tune'))closeTune()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('tune').hidden)closeTune()});
$('tuneReset').onclick=()=>{T={...TUNE_DEF};store.set('dk-tune3',T);applyTune();renderTune()};
$('showMind').checked=store.get('dk-mind',false);$('showMind').onchange=()=>store.set('dk-mind',$('showMind').checked);

// ---------- 描く ----------
const cv=$('cv'),cx=cv.getContext('2d');let W=0,H=0;
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);
// 下の操作が出たり、調整を開いたりすると道の枠の大きさが変わる。そのたびに測り直す（測り直さないと絵がつぶれる）
try{new ResizeObserver(resize).observe(cv)}catch(e){}
function draw(now){
  const ground=css('--ground'),ink=css('--ink'),red=css('--red'),card=css('--card'),muted=css('--muted'),accent=css('--accent');
  cx.clearRect(0,0,W,H);
  const gy=H*0.56,left=W*0.06,right=W*0.84,X=x=>left+(right-left)*(x-2)/(P.GOAL_POS-2);
  cx.fillStyle=ground;cx.fillRect(0,gy,W,H-gy);
  // スタートの線
  cx.strokeStyle=muted;cx.setLineDash([4,4]);cx.beginPath();cx.moveTo(X(2),gy-6);cx.lineTo(X(2),H);cx.stroke();cx.setLineDash([]);
  // だるま
  // 足もとは子どもの列のまん中あたり（子どもから見て正面）
  const yT=gy+(H-gy)*0.42,dx=W*0.91,dr=Math.min(H*0.17,W*0.07),dy=yT-dr*1.1;
  if(st){ // 強気度の光（色・大きさ・脈の速さ）。予約は見えない
    const lc=TIER_COL[st.reward],li=LV_ORDER.indexOf(st.reward),beat=0.5+0.5*Math.sin(now/1000*Math.PI*2*PULSE[st.reward]),ar=dr*(1.35+0.15*li+0.12*beat);
    const g=cx.createRadialGradient(dx,dy,dr*0.6,dx,dy,ar);g.addColorStop(0,lc+'cc');g.addColorStop(1,lc+'00');
    cx.fillStyle=g;cx.beginPath();cx.arc(dx,dy,ar,0,7);cx.fill();
    cx.textAlign='center';cx.font=`900 ${Math.max(11,dr*0.42)}px ${css('--ui')}`;cx.fillStyle=lc;cx.fillText('強気度 '+LV_NAME[st.reward],dx-dr*0.3,dy-dr*1.55);
    // 気力のゲージ（線より少ないと振り向けない）
    const cost=Core.turnCostOf(P,st),bw=dr*2,bx=dx-dr,by=yT+6,bh=7;
    cx.fillStyle=css('--line');cx.fillRect(bx,by,bw,bh);
    cx.fillStyle=st.stamina>=cost?lc:muted;cx.fillRect(bx,by,bw*Math.min(1,st.stamina/st.staminaMax),bh);
    cx.strokeStyle=ink;cx.lineWidth=1.5;const cxp=bx+bw*Math.min(1,cost/st.staminaMax);cx.beginPath();cx.moveTo(cxp,by-3);cx.lineTo(cxp,by+bh+3);cx.stroke();
    cx.fillStyle=ink;cx.font=`700 ${Math.max(10,dr*0.32)}px ${css('--ui')}`;cx.fillText(st.stamina>=cost?'気力':'気力が足りない',dx,by+bh+14);
  }
  cx.fillStyle=red;cx.beginPath();cx.ellipse(dx,dy,dr*0.95,dr*1.1,0,0,7);cx.fill();
  if(st&&cpu&&$('showMind').checked&&st.cpuThought&&(phase==='chant'||phase==='look')){
    cx.font=`900 ${Math.max(10,dr*0.34)}px ${css('--ui')}`;cx.textAlign='right';cx.fillStyle=ink;cx.fillText(st.cpuThought,dx-dr*1.3,dy-dr*0.2)}
  const faceOn=phase==='look'||phase==='push';
  if(faceOn){ // 顔（振り向いている）。振り向く動き：顔が横から回ってくる（0.2 秒）
    const f=Math.min(1,(gt-faceAt)/200),fx=dx+dr*0.6*(1-f)-dr*0.12*f,sx=0.25+0.75*f;
    cx.save();cx.translate(fx,0);cx.scale(sx,1);cx.translate(-fx,0);
    cx.fillStyle=card;cx.beginPath();cx.ellipse(fx,dy-dr*0.2,dr*0.55,dr*0.5,0,0,7);cx.fill();
    // 見ている間は、目が子どもを見回す
    const look=phase==='look'?Math.sin((gt-faceAt)/180)*dr*0.06:0;
    cx.fillStyle=ink;cx.strokeStyle=ink;cx.lineWidth=1.5;for(const s of[-1,1]){cx.beginPath();cx.arc(fx+s*dr*0.22-dr*0.04+look,dy-dr*0.25,dr*0.11,0,7);cx.fill()}
    cx.beginPath();cx.arc(fx,dy-dr*0.02,dr*0.12,0,Math.PI);cx.stroke();cx.restore();
  }
  if(!st)return;
  // 子ども（奥から順に。奥ほど上で小さく、手前ほど下で大きい）
  const moving=phase==='chant'||phase==='look',u=moving?Math.min(1,(gt-prevAt)/P.TICK_MS):1,n=st.children.length,mind=$('showMind').checked;
  st.children.forEach((c,i)=>{
    let pos=(prev?prev[i]:c.pos)+(c.pos-(prev?prev[i]:c.pos))*u;
    const hit=caughtAt[c.id]!=null&&(phase==='look'||phase==='push')&&caughtAt[c.id]>=faceAt;
    if(push&&push.dur){const k=Math.min(1,(gt-push.t0)/push.dur),e=1-Math.pow(1-k,3);pos=push.from[i]+(push.to[i]-push.from[i])*e}
    // 前の子ども役と同じ：足は地面の帯の上。奥（i=0）ほど上で小さく、手前ほど下で大きい
    const s=Math.min(H*0.075,W*0.05)*(0.8+0.15*i*2/Math.max(1,n-1)),y=gy+6+i*(H-gy-12)/(Math.max(1,n-1)*1.1),col=c.human?accent:c.col;
    // 見つかった直後はビクッと震える
    const x=X(pos)+(hit&&gt-caughtAt[c.id]<350?Math.sin((gt-caughtAt[c.id])/18)*s*0.15:0);
    // すべった跡：振り向いたところから、見つかったところまで（押し戻されている間も残す）
    if(hit&&st.look){const xa=X(st.look.from[i]),xb=X(push&&push.dur?push.from[i]:c.pos);cx.strokeStyle=red;cx.lineWidth=Math.max(2,s*0.15);cx.setLineDash([s*0.3,s*0.25]);cx.beginPath();cx.moveTo(xa,y+3);cx.lineTo(xb,y+3);cx.stroke();cx.setLineDash([])}
    cx.globalAlpha=1;
    // 走り方が見て分かるように（2026-10-18）：全力は前かがみで大またに、土ぼこり。小走りはまっすぐ小さく。
    //   歩くはゆっくり。ブレーキは体をそらして踏んばり、足もとにすべった跡。だるまからも同じに見える
    const f=c.vel/c.maxSpeed,mv=(moving||phase==='push')&&c.vel>0.01,g=mv?gaitOf(c,i):'止まってる';
    const lean=g==='全力'?0.28:g==='小走り'?0.1:g==='ブレーキ'?-0.22:0;
    const amp=g==='全力'?0.95:g==='小走り'?0.6:g==='歩く'?0.35:g==='ブレーキ'?0.15:0;
    const leg=mv?Math.sin(pos*(g==='全力'?1.6:2.4))*amp:0;
    if(g==='全力'){ // 土ぼこり（後ろに流れる）
      for(let k=0;k<3;k++){const t=((gt/260+k/3+i*0.17)%1),px=x-s*(0.5+t*1.6),py=y-s*(0.1+t*0.5);
        cx.globalAlpha=(1-t)*0.45;cx.fillStyle=muted;cx.beginPath();cx.arc(px,py,s*(0.15+t*0.25),0,7);cx.fill()}cx.globalAlpha=1}
    if(g==='ブレーキ'){cx.strokeStyle=muted;cx.lineWidth=Math.max(1.5,s*0.1);cx.beginPath();cx.moveTo(x-s*1.2,y+1);cx.lineTo(x+s*0.3,y+1);cx.stroke()}
    cx.save();cx.translate(x,y);cx.rotate(lean);cx.translate(-x,-y);
    cx.strokeStyle=col;cx.lineWidth=s*0.28;cx.lineCap='round';
    for(const sg of[1,-1]){cx.beginPath();cx.moveTo(x,y-s*0.9);cx.lineTo(x+Math.sin(leg*sg)*s*0.8,y-Math.max(0,Math.cos(leg*sg))*0+(g==='全力'?-Math.max(0,Math.sin(leg*sg))*s*0.25:0));cx.stroke()}
    cx.fillStyle=col;cx.beginPath();cx.ellipse(x,y-s*1.5,s*0.55,s*0.75,0,0,7);cx.fill();
    // 腕と手（2026-10-19）。手は頭と同じ白い丸で、体に重なっても見えるように。
    //   走る：足と逆に振る（全力ほど大きく）／止まる：下ろす／ブレーキ：前に出して踏んばる／見つかった：両手を上げてビクッ
    const sh={x,y:y-s*1.95},hands=[];
    if(hit)hands.push([x-s*0.75,y-s*3.0],[x+s*0.75,y-s*3.0]);
    else if(g==='ブレーキ')hands.push([x+s*0.85,y-s*2.2],[x+s*0.55,y-s*1.6]);
    else if(mv&&amp>0.2)for(const sg of[1,-1]){const v=Math.sin(leg*sg);hands.push([x+sg*s*(0.62+0.3*amp)+v*s*0.25*amp,y-s*(1.45+0.35*amp*v)])}
    else hands.push([x-s*0.72,y-s*1.1],[x+s*0.72,y-s*1.1]);
    cx.strokeStyle=col;cx.lineWidth=s*0.18;
    for(const [hx,hy] of hands){cx.beginPath();cx.moveTo(sh.x,sh.y);cx.lineTo(hx,hy);cx.stroke()}
    for(const [hx,hy] of hands){cx.fillStyle=card;cx.beginPath();cx.arc(hx,hy,s*0.17,0,7);cx.fill();cx.strokeStyle=col;cx.lineWidth=s*0.08;cx.stroke()}
    cx.fillStyle=card;cx.beginPath();cx.arc(x,y-s*2.55,s*0.48,0,7);cx.fill();cx.strokeStyle=col;cx.lineWidth=s*0.12;cx.stroke();
    cx.restore();
    cx.globalAlpha=1;cx.textAlign='center';
    const label=(c.human?'あなた':c.name.replace(/^.*の/,''))+(c.winded?' ぜぇ…':'');
    cx.fillStyle=c.human?ink:muted;cx.font=`700 ${Math.max(c.human?11:10,s*(c.human?0.6:0.5))}px ${css('--ui')}`;cx.fillText(label,x,y-s*3.3);
    if(hit){cx.fillStyle=red;cx.font=`900 ${Math.max(14,s*1.1)}px ${css('--pop')}`;cx.fillText('！',x,y-s*3.3-Math.max(12,s*0.7))}
    if(mind||c.human){const bw=s*1.6,bx=x-bw/2,by=y+5;cx.fillStyle=css('--line');cx.fillRect(bx,by,bw,3);cx.fillStyle=c.winded?red:accent;cx.fillRect(bx,by,bw*c.energy/c.energyMax,3)}
    if(mind&&!c.human){const m=[gaitOf(c,i),c.intendsToStop===false?'賭け':''].filter(Boolean).join('・');if(m){cx.fillStyle=c.intendsToStop===false?red:ink;cx.font=`900 ${Math.max(9,s*0.48)}px ${css('--ui')}`;cx.fillText(m,x,y-s*3.3-Math.max(11,s*0.6))}}
  });
  $('gauge').style.width=`calc((100% - 24px) * ${me?Math.min(1,me.vel/me.maxSpeed):0})`;
}

// ---------- まわす ----------
function frame(now){
  const dt=Math.min(100,now-lastNow);lastNow=now;
  if(!paused&&!(tut&&tut.hold)&&st&&phase!=='over'&&phase!=='setup'){
    gt+=dt;
    for(let k=0;k<timers.length;k++){if(gt>=timers[k].at){const f=timers[k].fn;timers.splice(k--,1);f()}}
    if(phase==='chant'||phase==='look'){acc+=dt;while(acc>=P.TICK_MS&&(phase==='chant'||phase==='look')&&!(tut&&tut.hold)){acc-=P.TICK_MS;if(phase==='chant')tick();else lookTick()}}
  }
  draw(now);requestAnimationFrame(frame);
}
renderTune();resize();renderSetup();$('overP').textContent=HOW[role];renderChant();requestAnimationFrame(frame);
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>だるまさんがころんだ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Mochiy+Pop+One&display=swap">
<style>
/* だるま役も子ども役も同じ画面。上に「だるまさんがころんだ」、まん中に道（横から見た図）、下に役ごとの操作。
   決まりは rules.js（old/daruma-core.js の上に今の決まりを足したもの）。見た目は前の子ども役の試作（proto-kids.html）と同じ */
:root{
  --bg:#fff7ec; --card:#fffdf9; --ink:#4a2f22; --muted:#8f6b58; --line:#f1dcc6;
  --accent:#c2601a; --on:#ffe2bd; --red:#d8452f; --ground:#e9d2b0; --sky:#fff1dc;
  --ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --pop:"Mochiy Pop One","Zen Maru Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#231a15; --card:#2f241d; --ink:#f6e6d6; --muted:#c3a58f; --line:#4a382c;
  --accent:#f0954a; --on:#5a3a1f; --red:#ff6a52; --ground:#4a3a2c; --sky:#2a201a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#231a15; --card:#2f241d; --ink:#f6e6d6; --muted:#c3a58f; --line:#4a382c;
  --accent:#f0954a; --on:#5a3a1f; --red:#ff6a52; --ground:#4a3a2c; --sky:#2a201a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-weight:500;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{height:100%;max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;gap:8px}
h1{font-family:var(--pop);font-size:1.05rem;margin:0;font-weight:400;flex:1 1 auto;min-width:0}
.chant{font-family:var(--pop);font-size:clamp(1.3rem,6vw,2rem);text-align:center;letter-spacing:.06em;min-height:1.4em;white-space:nowrap}
.chant span{color:var(--line)}.chant span.said{color:var(--ink)}.chant.look{color:var(--red)}
.stage{position:relative;flex:0 0 auto;height:clamp(170px,58vw,320px);border-radius:16px;overflow:hidden;background:var(--sky);border:2px solid var(--line)}
canvas{display:block;width:100%;height:100%}
.msg{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-family:var(--pop);font-size:clamp(1.3rem,6.5vw,2.2rem);color:var(--red);text-shadow:0 2px 0 var(--card);pointer-events:none;white-space:nowrap}
.paused{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:.8rem;font-weight:700;color:var(--muted);pointer-events:none}
.hud{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hud b{color:var(--ink)}
.pill{font:inherit;font-weight:700;font-size:.85rem;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.pill[aria-expanded="true"],.pill.on{background:var(--on);border-color:var(--accent)}
.pill:focus-visible,.btn:focus-visible,.pad:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* 子ども役：大きなパッド */
.pad{flex:1 1 auto;min-height:130px;max-height:340px;border-radius:20px;border:3px solid var(--accent);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  touch-action:none;cursor:pointer;font-family:var(--pop);font-size:1.3rem;color:var(--accent);position:relative;overflow:hidden}
.pad small{font-family:var(--ui);font-weight:700;font-size:.8rem;color:var(--muted)}
.pad.down{background:var(--on)}
.gauge{position:absolute;left:0;bottom:0;height:8px;background:var(--accent);width:0}
/* だるま役：操作のカード */
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.lbl{font-size:.8rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.row{display:flex;gap:6px}.row>*{flex:1 1 0;min-width:0}
.btn{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 6px;cursor:pointer;line-height:1.3}
.btn small{display:block;font-size:.68rem;font-weight:500;color:var(--muted)}
.btn.on{background:var(--on);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card);font-family:var(--pop);font-weight:400;font-size:1.1rem}
.btn[disabled]{opacity:.45;cursor:default}
.lv{--c:var(--line);position:relative}.lv.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.lv.next{border-style:dashed;border-color:var(--c)}.lv.next::after{content:'予約';position:absolute;top:3px;right:6px;font-size:.65rem;color:var(--c)}
input[type=range]{width:100%;accent-color:var(--accent)}
.arm.on{background:var(--on);border-color:var(--red)}
/* はじめる・終わりの画面 */
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--bg) 86%,transparent);text-align:center;padding:12px;overflow:auto}
.over h2{font-family:var(--pop);font-weight:400;margin:0;font-size:1.5rem}
.over p{margin:0;font-size:.86rem;color:var(--muted);max-width:32em}
.choices{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.go{font:inherit;font-family:var(--pop);font-size:1.15rem;border:0;border-radius:14px;background:var(--accent);color:var(--card);padding:12px 26px;cursor:pointer}
/* 調整（デバッグ） */
.tune{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-height:45vh;overflow:auto}
.tuneTop{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tuneRows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
@media (max-width:480px){.tuneRows{grid-template-columns:minmax(0,1fr)}}
.tuneRows label{display:flex;flex-direction:column;gap:2px;font-size:.78rem;font-weight:700;color:var(--muted)}
.tuneRows label span{display:flex;justify-content:space-between}.tuneRows label b{color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:.78rem;color:var(--muted);margin:0}
.check{font-size:.8rem;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.log{font-size:.76rem;color:var(--muted);max-height:7em;overflow:auto;border-top:1px dashed var(--line);padding-top:6px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>だるまさんがころんだ</h1>
    <button type="button" class="pill" id="pauseBtn" hidden>⏸ 中断</button>
    <button type="button" class="pill" id="tuneBtn" aria-expanded="false">⚙ 調整</button>
  </header>
  <section class="tune" id="tune" hidden aria-label="調整">
    <div class="tuneTop">
      <button type="button" class="pill" id="pause2">⏸ 中断</button>
      <button type="button" class="pill" id="quitBtn">やめる</button>
      <label class="check"><input type="checkbox" id="showMind"> CPU の子の考えを見る</label>
      <button type="button" class="pill" id="tuneReset">最初の値に戻す</button>
    </div>
    <div class="tuneRows" id="tuneRows"></div>
    <p class="note">変えた数字はこのブラウザに覚えます。★は次のゲームから効きます。それ以外はすぐ効きます。</p>
    <div class="log" id="log"></div>
  </section>
  <div class="chant" id="chant"></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="paused" id="paused" hidden></div>
    <div class="msg" id="msg" hidden></div>
    <div class="over" id="over">
      <h2 id="overH">だるまさんがころんだ</h2>
      <div class="choices" id="roles"></div>
      <p id="overP"></p>
      <div class="choices" id="types"></div>
      <button class="go" id="startBtn" type="button">はじめる</button>
    </div>
  </div>
  <div class="hud"><span>だるまの時計 のこり <b id="left">40.0</b>秒</span><span><b id="cycle">1</b>回目</span><span id="qiBox">気力 <b id="qi">—</b></span></div>

  <!-- だるま役の操作 -->
  <div class="card" id="ctlDaruma" hidden>
    <div><div class="lbl"><span>強気度</span><span id="lvNote"></span></div>
      <div class="row" id="lvRow"></div></div>
    <div><div class="lbl"><span>テンポ</span><span id="tempoTxt"></span></div>
      <input type="range" id="tempo" min="0" max="100" step="1" value="45" aria-label="テンポ"></div>
    <div class="row"><button class="btn arm on" id="arm" type="button"></button><button class="btn primary" id="go" type="button">言い始める</button></div>
  </div>
  <!-- 子ども役の操作 -->
  <div class="pad" id="pad" hidden tabindex="0" role="button" aria-label="押して走る">押して走る<small>押しっぱなしで走る・離して止まる（スペースキーでも）</small><div class="gauge" id="gauge"></div></div>
</div>
<script src="old/daruma-core.js"></script>
<script src="rules.js"></script>
<script>
'use strict';
const R=window.DarumaRules,Core=R.Core,P=R.P,TIERS=R.TIERS;
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const TIER_COL={low:'#4f8fd8',mid:'#e5b830',high:'#ef8a2c',max:'#e0402c'},PULSE={low:0.6,mid:1,high:1.6,max:2.6};
const KID_COL=['#4f8fd8','#3aa65a','#b45cc8','#e0457b'];
const TYPE_NOTE={normal:'クセなし。まずはこれで。',red:'気力の器が大きいぶん、見送っても実入りが細い。',oni:'振り向きが安い。そのかわりテンポを上げるのが高い。',attack:'テンポが安い。そのかわり振り向きが高い。'};
const HOW={
  kid:'あなたはオレンジの子。だるまが言っている間だけ進めます。振り向いたときに動いていたら40下がる。だれか1人でもだるまにタッチしたら子どもの勝ち、だるまの時計（言っている時間だけ進む）が切れたらだるまの勝ち。うしろの光が強いほど、だるまは見送りやすい。',
  daruma:'あなたはだるま。CPU の子ども4人がタッチしようと走ってきます。言い終わったときに動いていた子を下がらせて、時計が切れるまで耐えたら勝ち。見送ると止まらずに「だ」からそのまま続きます。'};

// ---------- 調整の数字（⚙ 調整で変えられる。変えた値はこのブラウザに覚える） ----------
// 時計と下がる量は、シミュレーター（sim.js）で決めた値（2026-10-18）。子ども役は 40 秒、だるま役は 42 秒
const TUNE_DEF={accT:0.33,stopT:0.5,cpuStopMin:0.4,cpuStopMax:0.7,grace:0.1,clockKid:40,clockDaruma:42,knock:40,breakMin:1.0,breakMax:3.5,cue:0.8,watch:1.2};
const TUNE_INFO=[['accT','あなた：全速になるまで',0.1,1,0.01,'秒'],['stopT','あなた：全速から止まるまで',0.1,1.5,0.05,'秒'],
  ['cpuStopMin','★CPU の子：止まるまで（最短）',0.1,1.5,0.05,'秒'],['cpuStopMax','★CPU の子：止まるまで（最長）',0.1,1.5,0.05,'秒'],
  ['grace','振り向いてから見るまで',0,0.5,0.1,'秒'],['clockKid','だるまの時計（子ども役のとき）',20,90,1,'秒'],['clockDaruma','だるまの時計（だるま役のとき）',20,90,1,'秒'],
  ['knock','捕まったら下がる（96でスタートへ）',0,96,1,''],
  ['breakMin','ひと休み（いちばん短い）',0,5,0.1,'秒'],['breakMax','ひと休み（いちばん長い）',0,8,0.1,'秒'],
  ['cue','「すぅ…」の合図',0,2,0.1,'秒前'],['watch','振り向いて見ている時間',0.3,3,0.1,'秒']];
let T={...TUNE_DEF,...store.get('dk-tune3',{})};
function applyTune(){P.GOAL_TICKS=Math.round((role==='daruma'?T.clockDaruma:T.clockKid)*1000/P.TICK_MS);P.CATCH_KNOCK=T.knock>=96?null:T.knock;if(me)R.setMe(me,T.accT,T.stopT);renderCtl()}

const q=new URLSearchParams(location.search);
let role=q.get('role')||store.get('dk-role','kid');if(role!=='daruma')role='kid';
let pickedType='normal';
let st=null,me=null,cpu=null,phase='setup',paused=false;
// 時間はゲームの中の時計（gt, ミリ秒）で進める。中断している間は止まる
let gt=0,acc=0,lastNow=performance.now(),timers=[],prev=null,prevAt=0,faceUntil=0,graceLeft=0;
const caughtAt={};
function later(ms,fn){timers.push({at:gt+ms,fn})}

// ---------- 画面の部品 ----------
function renderSetup(){
  $('roles').innerHTML=[['kid','子どもで遊ぶ'],['daruma','だるまで遊ぶ']].map(([k,l])=>`<button class="pill${k===role?' on':''}" data-r="${k}" type="button">${l}</button>`).join('');
  $('roles').querySelectorAll('button').forEach(b=>b.onclick=()=>{role=b.dataset.r;store.set('dk-role',role);renderSetup();if(phase==='setup')$('overP').textContent=HOW[role]});
  $('types').hidden=role!=='daruma';
  $('types').innerHTML=Object.keys(P.DARUMA_TYPES).map(k=>`<button class="pill${k===pickedType?' on':''}" data-t="${k}" type="button" title="${TYPE_NOTE[k]||''}">${P.DARUMA_TYPES[k].label}</button>`).join('');
  $('types').querySelectorAll('button').forEach(b=>b.onclick=()=>{pickedType=b.dataset.t;renderSetup()});
}
function renderCtl(){
  if(!st)return;
  $('left').textContent=Math.max(0,(P.GOAL_TICKS-st.elapsedTicks)*P.TICK_MS/1000).toFixed(1);$('cycle').textContent=st.cycle;
  $('qiBox').hidden=role!=='daruma';
  if(role!=='daruma')return;
  const prep=phase==='prep';
  $('lvRow').innerHTML=TIERS.map(t=>`<button class="btn lv${st.reward===t?' on':''}${st.nextReward===t?' next':''}" data-r="${t}" style="--c:${TIER_COL[t]}" type="button">${P.REWARD[t].label}<small>見送り+${Math.round(P.REWARD[t].reward*st.type.skipRewardScale)}<br>振向−${Math.round(Core.turnCostOf(P,st,t))}</small></button>`).join('');
  const cost=Math.round(Core.turnCostOf(P,st)),afford=st.stamina>=cost;
  $('arm').classList.toggle('on',st.turnArmed);
  $('arm').innerHTML=st.turnArmed?`👀 言い終わったら振り向く<small>気力 -${cost}${afford?'':'（足りない）'}</small>`:`🙈 振り向かずに見送る<small>気力 +${Math.round(Core.currentSkipReward(P,st))}</small>`;
  $('go').disabled=!prep||paused;
  $('tempo').value=Math.round(st.tempoValue);$('tempoTxt').textContent=Core.tempoLabel(st.tempoValue)+(phase==='chant'?'（上げると気力を使う）':'');
  $('qi').textContent=`${Math.round(st.stamina)} / ${Math.round(st.staminaMax)}`;
  $('lvNote').textContent=prep?'':st.nextReward?'次の「だ」で変わる':'押すと予約';
}
function renderChant(){const el=$('chant');el.classList.toggle('look',gt<faceUntil);
  if(phase==='prep'||phase==='cue'){el.innerHTML=`<span class="said">${phase==='cue'?'すぅ…':'ひと休み'}</span>`;return}
  const n=st?R.said(st):0;el.innerHTML=Core.CHANT_CHARS.map((s,k)=>`<span class="${k<n?'said':''}">${s}</span>`).join('')}
let msgT=0;function showMsg(s,ms){const m=$('msg');m.textContent=s;m.hidden=false;clearTimeout(msgT);msgT=setTimeout(()=>m.hidden=true,ms||1100)}
function log(s){$('log').insertAdjacentHTML('afterbegin',`<div>${s}</div>`)}
function setPaused(s){$('paused').textContent=s||'';$('paused').hidden=!s}
let pausedNote='';
function note(s){pausedNote=s||'';setPaused(paused?'中断中（⏸ をもう一度で再開）':pausedNote)}

// ---------- 音 ----------
let actx=null;
function ac(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}return actx}
function beep(f,d,type='triangle'){const a=actx;if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.12,n);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.connect(g).connect(a.destination);o.start(n);o.stop(n+d+0.02)}

// ---------- 進める ----------
function start(){
  ac();timers=[];acc=0;paused=false;
  st=R.newGame({withMe:role==='kid',lane:P.ACTIVE_CHILDREN-1,type:role==='daruma'?pickedType:'normal',accT:T.accT,stopT:T.stopT,cpuStop:[T.cpuStopMin,Math.max(T.cpuStopMin,T.cpuStopMax)]});
  let ci=0;st.children.forEach((c,i)=>{c.lane=i;c.col=c.human?null:KID_COL[ci++]});
  me=st.children.find(c=>c.human)||null;cpu=role==='kid'?R.cpuDaruma():null;
  applyTune();
  $('ctlDaruma').hidden=role!=='daruma';$('pad').hidden=role!=='kid';$('pauseBtn').hidden=false;
  $('over').hidden=true;$('log').innerHTML='';prev=snap();prevAt=gt;
  log(role==='kid'?`子ども：${st.children.map(c=>c.name).join('・')}`:`${st.type.label}で始めた。子ども：${st.children.map(c=>c.name).join('・')}`);
  renderPause();toPrep(true);
}
const snap=()=>st.children.map(c=>c.pos);
function toPrep(first){
  phase='prep';R.applyReserved(st);
  if(role==='daruma'){st.turnArmed=true;note(first?'':'時間は止まっている。今のうちに作戦を立てよう')}
  else{cpu.onPrep(st);const b=first?1500:(T.breakMin+Math.random()*Math.max(0,T.breakMax-T.breakMin))*1000;
    later(Math.max(0,b-T.cue*1000),toCue);note('ひと休み。動けない')}
  renderCtl();renderChant();
}
function toCue(){phase='cue';beep(260,0.5,'sine');renderCtl();renderChant();later(T.cue*1000,toChant)}
function toChant(){phase='chant';acc=0;note('');renderCtl();renderChant()}
function step(){ // 0.1秒ぶん世界を進める
  if(me)me.input=pressed;
  prev=snap();prevAt=gt;
  return Core.tick(P,st);
}
function tick(){
  const before=R.said(st),res=step();
  const n=R.said(st);if(n>before&&n<10)beep(520+n*18,0.06);
  if(res.reached){end(res.reached);return}
  if(res.timeUp){end(null);return}
  if(res.chantDone){
    beep(330,0.18);
    if(st.turnArmed&&st.stamina>=Core.turnCostOf(P,st)){
      // 振り向いた。見るまで grace 秒だけ動きを進める（止まりかけの子は見逃す）
      faceUntil=gt+T.watch*1000+T.grace*1000;graceLeft=Math.round(T.grace*1000/P.TICK_MS);renderChant();
      if(graceLeft>0){phase='grace';acc=0;return}
    }
    resolve();return}
  if(cpu)cpu.onTick(st);
  renderCtl();renderChant();
}
function graceTick(){const cp=st.chantProgress,el=st.elapsedTicks;step();st.chantProgress=cp;st.elapsedTicks=el;if(--graceLeft<=0)resolve()}
function resolve(){
  const cost=Math.round(Core.turnCostOf(P,st)),cyc=st.cycle;
  const out=R.resolve(st);
  if(out.carry){
    // 見送り：止まらずに続ける。最後の「だ」が次の「だ」
    log(`${cyc}回目：見送った`+(role==='daruma'?`（気力+${Math.round(out.gained)}）`:''));showMsg('見送り！',800);
    if(cpu)cpu.onCarry(st);else st.turnArmed=false;
    phase='chant';renderCtl();renderChant();return}
  phase='watch';
  if(out.turned){
    const names=out.caught.map(c=>c.name);
    out.caught.forEach(c=>caughtAt[c.id]=gt);if(out.caught.length)beep(150,0.25,'sawtooth');
    const meCaught=me&&out.caught.includes(me);
    showMsg(meCaught?'見つかった！下がる':out.caught.length?'見た！ '+names.join('・'):'見た！ …みんな止まってた',T.watch*1000);
    log(`${cyc}回目：振り向いた`+(role==='daruma'?`（気力-${cost}）`:'')+(out.caught.length?` → ${names.join('・')} を下がらせた`:' → 誰も動いてなかった'))}
  else{showMsg('力が足りない…',1000);log(`${cyc}回目：振り向こうとしたが、気力が足りなかった`)}
  prev=snap();prevAt=gt;renderCtl();renderChant();
  later(out.turned?T.watch*1000:1000,()=>toPrep(false));
}
function end(kid){phase='over';timers=[];paused=false;renderCtl();renderChant();note('');$('pauseBtn').hidden=true;renderPause();
  const left=Math.max(0,(P.GOAL_TICKS-st.elapsedTicks)*P.TICK_MS/1000).toFixed(1);let h,p;
  if(role==='daruma'){h=kid?`${kid.name}にタッチされた`:'だるまの勝ち！';p=kid?`${st.cycle}回目、時計はのこり${left}秒だった。捕まえたのは${st.catches}回。`:`耐えきった。${st.cycle}回言って、捕まえたのは${st.catches}回。`}
  else{h=!kid?'時間切れ…だるまの勝ち':kid===me?'タッチ！あなたの勝ち':`${kid.name}がタッチ！子どもの勝ち`;
    p=kid?`だるまの時計は、のこり${left}秒だった。`:`あなたはあと${Math.max(0,P.GOAL_POS-me.pos).toFixed(0)}だった。`}
  if(kid)beep(880,0.15);
  $('overH').textContent=h;$('overP').textContent=p;$('startBtn').textContent='もう一回';$('over').hidden=false;renderSetup()}
function quit(){phase='setup';timers=[];paused=false;st=null;me=null;note('');$('pauseBtn').hidden=true;renderPause();
  $('ctlDaruma').hidden=true;$('pad').hidden=true;
  $('overH').textContent='だるまさんがころんだ';$('overP').textContent=HOW[role];$('startBtn').textContent='はじめる';$('over').hidden=false;renderSetup();renderChant()}
function togglePause(){if(!st||phase==='over'||phase==='setup')return;paused=!paused;renderPause();note(pausedNote);renderCtl()}
function renderPause(){const t=paused?'▶ 再開':'⏸ 中断';$('pauseBtn').textContent=t;$('pause2').textContent=t;$('pauseBtn').classList.toggle('on',paused);$('pause2').classList.toggle('on',paused)}

// ---------- 入力 ----------
$('startBtn').onclick=start;
$('pauseBtn').onclick=togglePause;$('pause2').onclick=togglePause;$('quitBtn').onclick=quit;
// だるま役：強気度は、ひと休み中はすぐ変わり、言っている間は予約（次の「だ」かひと休みで変わる）。ボタンは描き直すので押した瞬間に拾う
$('lvRow').addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||!st||role!=='daruma'||phase==='over'||phase==='setup'||paused)return;
  const r=b.dataset.r;if(phase==='prep')st.reward=r;else st.nextReward=(r===st.reward||r===st.nextReward)?null:r;renderCtl()});
$('go').onclick=()=>{if(phase==='prep'&&role==='daruma'&&!paused){ac();toCue()}};
$('arm').onclick=()=>{if(!st||phase==='over'||paused)return;st.turnArmed=!st.turnArmed;renderCtl()};
$('tempo').oninput=()=>{if(!st||paused){renderCtl();return}const want=+$('tempo').value;
  if(phase==='chant'){const got=Core.applyTempoChange(P,st,want);if(got!==want)$('tempo').value=got}else st.tempoValue=want;renderCtl()};
// 子ども役：押している間だけ走る
let pressed=false;const pad=$('pad');
pad.addEventListener('pointerdown',e=>{e.preventDefault();ac();pressed=true;pad.classList.add('down');try{pad.setPointerCapture(e.pointerId)}catch(_){}});
const up=()=>{pressed=false;pad.classList.remove('down')};
pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat||role!=='kid'||!st)return;e.preventDefault();ac();pressed=true;pad.classList.add('down')});
addEventListener('keyup',e=>{if(e.code==='Space')up()});
// 調整
function renderTune(){
  $('tuneRows').innerHTML=TUNE_INFO.map(([k,n,lo,hi,s,u])=>`<label for="t_${k}"><span>${n}<b id="tv_${k}">${T[k]}${u}</b></span><input type="range" id="t_${k}" min="${lo}" max="${hi}" step="${s}" value="${T[k]}"></label>`).join('');
  TUNE_INFO.forEach(([k,,,,,u])=>{const el=$('t_'+k);el.oninput=()=>{T[k]=+el.value;$('tv_'+k).textContent=T[k]+u;store.set('dk-tune3',T);applyTune()}});
}
$('tuneBtn').onclick=()=>{const t=$('tune');t.hidden=!t.hidden;$('tuneBtn').setAttribute('aria-expanded',!t.hidden);resize()};
$('tuneReset').onclick=()=>{T={...TUNE_DEF};store.set('dk-tune3',T);applyTune();renderTune()};
$('showMind').checked=store.get('dk-mind',false);$('showMind').onchange=()=>store.set('dk-mind',$('showMind').checked);

// ---------- 描く ----------
const cv=$('cv'),cx=cv.getContext('2d');let W=0,H=0;
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);
// 下の操作が出たり、調整を開いたりすると道の枠の大きさが変わる。そのたびに測り直す（測り直さないと絵がつぶれる）
try{new ResizeObserver(resize).observe(cv)}catch(e){}
function draw(now){
  const ground=css('--ground'),ink=css('--ink'),red=css('--red'),card=css('--card'),muted=css('--muted'),accent=css('--accent');
  cx.clearRect(0,0,W,H);
  const gy=H*0.68,left=W*0.06,right=W*0.84,X=x=>left+(right-left)*(x-2)/(P.GOAL_POS-2);
  cx.fillStyle=ground;cx.fillRect(0,gy,W,H-gy);
  // スタートの線
  cx.strokeStyle=muted;cx.setLineDash([4,4]);cx.beginPath();cx.moveTo(X(2),gy-6);cx.lineTo(X(2),H);cx.stroke();cx.setLineDash([]);
  // だるま
  // 足もとは子どもの列のまん中あたり（子どもから見て正面）
  const yT=gy+(H-gy)*0.42,dx=W*0.91,dr=Math.min(H*0.17,W*0.07),dy=yT-dr*1.1;
  if(st){ // 強気度の光（色・大きさ・脈の速さ）。予約は見えない
    const lc=TIER_COL[st.reward],li=TIERS.indexOf(st.reward),beat=0.5+0.5*Math.sin(now/1000*Math.PI*2*PULSE[st.reward]),ar=dr*(1.35+0.15*li+0.12*beat);
    const g=cx.createRadialGradient(dx,dy,dr*0.6,dx,dy,ar);g.addColorStop(0,lc+'cc');g.addColorStop(1,lc+'00');
    cx.fillStyle=g;cx.beginPath();cx.arc(dx,dy,ar,0,7);cx.fill();
    cx.textAlign='center';cx.font=`900 ${Math.max(11,dr*0.42)}px ${css('--ui')}`;cx.fillStyle=lc;cx.fillText('強気度 '+P.REWARD[st.reward].label,dx-dr*0.3,dy-dr*1.55);
    // 気力のゲージ（線より少ないと振り向けない）
    const cost=Core.turnCostOf(P,st),bw=dr*2,bx=dx-dr,by=yT+6,bh=7;
    cx.fillStyle=css('--line');cx.fillRect(bx,by,bw,bh);
    cx.fillStyle=st.stamina>=cost?lc:muted;cx.fillRect(bx,by,bw*Math.min(1,st.stamina/st.staminaMax),bh);
    cx.strokeStyle=ink;cx.lineWidth=1.5;const cxp=bx+bw*Math.min(1,cost/st.staminaMax);cx.beginPath();cx.moveTo(cxp,by-3);cx.lineTo(cxp,by+bh+3);cx.stroke();
    cx.fillStyle=ink;cx.font=`700 ${Math.max(10,dr*0.32)}px ${css('--ui')}`;cx.fillText(st.stamina>=cost?'気力':'気力が足りない',dx,by+bh+14);
  }
  cx.fillStyle=red;cx.beginPath();cx.ellipse(dx,dy,dr*0.95,dr*1.1,0,0,7);cx.fill();
  if(gt<faceUntil){ // 顔（振り向いている）
    cx.fillStyle=card;cx.beginPath();cx.ellipse(dx-dr*0.12,dy-dr*0.2,dr*0.55,dr*0.5,0,0,7);cx.fill();
    cx.fillStyle=ink;cx.strokeStyle=ink;cx.lineWidth=1.5;for(const s of[-1,1]){cx.beginPath();cx.arc(dx-dr*0.12+s*dr*0.22,dy-dr*0.25,dr*0.11,0,7);cx.fill()}
    cx.beginPath();cx.arc(dx-dr*0.12,dy-dr*0.02,dr*0.12,0,Math.PI);cx.stroke();
  }
  if(!st)return;
  // 子ども（奥から順に。奥ほど上で小さく、手前ほど下で大きい）
  const moving=phase==='chant'||phase==='grace',u=moving?Math.min(1,(gt-prevAt)/P.TICK_MS):1,n=st.children.length,mind=$('showMind').checked;
  st.children.forEach((c,i)=>{
    const x0=prev?prev[i]:c.pos,pos=x0+(c.pos-x0)*u;
    // 前の子ども役と同じ：足は地面の帯の上。奥（i=0）ほど上で小さく、手前ほど下で大きい
    const s=Math.min(H*0.075,W*0.05)*(0.8+0.15*i*2/(n-1)),y=gy+6+i*(H-gy-12)/((n-1)*1.1),x=X(pos),col=c.human?accent:c.col;
    cx.globalAlpha=caughtAt[c.id]!=null&&gt-caughtAt[c.id]<700?0.35:1;
    const mv=moving&&c.vel>P.CATCH_VEL_THRESHOLD,leg=mv?Math.sin(pos*2.4)*0.6:0;
    cx.strokeStyle=col;cx.lineWidth=s*0.28;cx.lineCap='round';
    for(const sg of[1,-1]){cx.beginPath();cx.moveTo(x,y-s*0.9);cx.lineTo(x+Math.sin(leg*sg)*s*0.7,y);cx.stroke()}
    cx.fillStyle=col;cx.beginPath();cx.ellipse(x,y-s*1.5,s*0.55,s*0.75,0,0,7);cx.fill();
    cx.fillStyle=card;cx.beginPath();cx.arc(x,y-s*2.55,s*0.48,0,7);cx.fill();cx.strokeStyle=col;cx.lineWidth=s*0.12;cx.stroke();
    cx.globalAlpha=1;cx.textAlign='center';
    const label=(c.human?'あなた':c.name.replace(/^.*の/,''))+(c.winded?' ぜぇ…':'');
    cx.fillStyle=c.human?ink:muted;cx.font=`700 ${Math.max(c.human?11:10,s*(c.human?0.6:0.5))}px ${css('--ui')}`;cx.fillText(label,x,y-s*3.3);
    if(mind&&!c.human){const m=c.freezing?'止まる':c.intendsToStop===false?'賭け':'';if(m){cx.fillStyle=m==='賭け'?red:ink;cx.font=`900 ${Math.max(9,s*0.48)}px ${css('--ui')}`;cx.fillText(m,x,y-s*3.3-Math.max(11,s*0.6))}}
  });
  $('gauge').style.width=(me?me.vel/me.maxSpeed*100:0)+'%';
}

// ---------- まわす ----------
function frame(now){
  const dt=Math.min(100,now-lastNow);lastNow=now;
  if(!paused&&st&&phase!=='over'&&phase!=='setup'){
    gt+=dt;
    for(let k=0;k<timers.length;k++){if(gt>=timers[k].at){const f=timers[k].fn;timers.splice(k--,1);f()}}
    if(phase==='chant'||phase==='grace'){acc+=dt;while(acc>=P.TICK_MS&&(phase==='chant'||phase==='grace')){acc-=P.TICK_MS;if(phase==='chant')tick();else graceTick()}}
  }
  draw(now);requestAnimationFrame(frame);
}
renderTune();resize();renderSetup();$('overP').textContent=HOW[role];renderChant();requestAnimationFrame(frame);
</script>
</body>
</html>

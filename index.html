<script>
'use strict';
const R=window.DarumaRules,Core=R.Core,P=R.P,TIERS=R.TIERS;
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// 言葉（2026-10-25）：日本語と英語。?lang=en・?lang=ja で選ぶと、このブラウザに覚える（また遊ぼのゲームで共通の mataasobo-lang）。
//   選んでいなければブラウザの言語（日本語以外は英語）。画面の決まった字は data-en、動きで変わる字は L('日本語','English')
const LANG=(()=>{let l=null;try{l=new URLSearchParams(location.search).get('lang');if(l==='en'||l==='ja')localStorage.setItem('mataasobo-lang',l);else l=localStorage.getItem('mataasobo-lang')}catch(e){}
  return l==='en'||l==='ja'?l:/^ja\b/i.test(navigator.language||'')?'ja':'en'})();
const EN=LANG==='en',L=(ja,en)=>EN?en:ja;
document.documentElement.lang=LANG;
if(EN){
  document.title='Red Light, Green Light (Daruma-san ga Koronda)';
  document.querySelectorAll('[data-en]').forEach(e=>e.innerHTML=e.dataset.en);
  document.querySelectorAll('[data-en-label]').forEach(e=>e.setAttribute('aria-label',e.dataset.enLabel));
  const h=document.querySelector('h1'),t='Red Light, Green Light';h.setAttribute('aria-label',t);h.innerHTML=[...t].map(s=>`<span>${s}</span>`).join('');
  $('chant').classList.add('en');
}
$('langBtn').textContent=EN?'日本語':'EN';$('langBtn').setAttribute('aria-label',EN?'日本語にする':'English');
$('langBtn').onclick=()=>{const u=new URLSearchParams(location.search);u.set('lang',EN?'ja':'en');location.search=u};
// 英語の名前（CPU の子）。日本語の名前は「強気なボウル」のように性格つきだが、英語では名前だけ
const KID_EN={c1:'Bowl',c2:'Cain',c3:'Mill',c4:'Ren',c5:'Yuki',c6:'Hayate',c7:'Koharu',c8:'Dai',c9:'Shizuka',c10:'Sora'};
const nm=c=>EN&&KID_EN[c.id]||c.name;
const CHANT_EN=['DA','RU','MA','SA','N','GA','KO','RO','N','DA'];
const TEMPO_EN={'かなり遅い':'very slow','遅め':'slow','ふつう':'normal','速め':'fast','かなり速い':'very fast'};
const tempoName=v=>{const s=Core.tempoLabel(v);return EN?TEMPO_EN[s]||s:s};
// オーラ（前の名前は強気度）の見せ方（2026-10-19）：オーラが強いほど振り向きやすい、の向きで見せる。子どもから見える光そのものの名前。しくみ（old/daruma-core.js の段階）は
//   そのままで、名前・並び・光だけ逆にしている。中身の low（振り向きが安い・見送りの実入りが少ない）が「激」、max が「低」
const LV_NAME=EN?{low:'Max',mid:'High',high:'Mid',max:'Low'}:{low:'全開',mid:'強',high:'中',max:'弱'},LV_ORDER=['max','high','mid','low'];
const TIER_COL={low:'#e0402c',mid:'#ef8a2c',high:'#e5b830',max:'#4f8fd8'},PULSE={low:2.6,mid:1.6,high:1,max:0.6};
const KID_COL=['#4f8fd8','#3aa65a','#b45cc8','#e0457b'];
const TYPE_NOTE={normal:'クセなし。まずはこれで。',red:'気力の器が大きいぶん、見送っても実入りが細い。',oni:'振り向きが安い。そのかわりテンポを上げるのが高い。',attack:'テンポが安い。そのかわり振り向きが高い。'};
const HOW=EN?{
  kid:"You're the orange runner. You can only move while the Daruma is chanting. If you're moving when it turns around, you get pushed back. If any runner touches the Daruma, the runners win. If the Daruma's clock (it only ticks while chanting) runs out, the Daruma wins. The stronger the Daruma's aura, the more likely it is to turn.",
  daruma:"You're the Daruma. 4 CPU runners are racing to touch you. Push back anyone still moving when your chant ends, and hold out until your clock runs out to win. If you let a chant pass, you go straight into the next one without stopping."}:{
  kid:'あなたはオレンジの子。だるまが唱えている間だけ進めます。振り向いたときに動いていたら少し下がる。だれか1人でもだるまにタッチしたら子どもの勝ち、だるまの時計（唱えている時間だけ進む）が切れたらだるまの勝ち。だるまのオーラが強いほど、だるまは振り向きやすい。',
  daruma:'あなたはだるま。CPU の子ども4人がタッチしようと走ってきます。唱え終わったときに動いていた子を下がらせて、時計が切れるまで耐えたら勝ち。見送ると止まらずに、そのまま次の「だるまさんがころんだ」に続きます。'};

// ---------- 調整の数字（⚙ 調整で変えられる。変えた値はこのブラウザに覚える） ----------
// 時計・猶予・下がる量は、シミュレーター（sim.js）で決めた値（2026-10-18）。全速まで 2 秒・止まるまで 1 秒にしたので、どちらの役も 46 秒
const TUNE_DEF={accT:2.0,stopT:1.0,cpuAccT:2.0,cpuStopMin:0.8,cpuStopMax:1.4,grace:0.3,clockKid:46,clockDaruma:46,knock:24,breakMin:1.0,breakMax:3.5,cue:0.8,watch:1.2};
const TUNE_INFO=[['accT','あなた：全速になるまで',0.3,3,0.1,'秒'],['stopT','あなた：全速から止まるまで',0.1,2.5,0.05,'秒'],
  ['cpuAccT','★CPU の子：全速になるまで（±15%）',0.3,3,0.1,'秒'],
  ['cpuStopMin','★CPU の子：止まるまで（最短）',0.1,2.5,0.05,'秒'],['cpuStopMax','★CPU の子：止まるまで（最長）',0.1,2.5,0.05,'秒'],
  ['grace','振り向き始めてから見つかるまでの猶予',0,0.5,0.1,'秒'],['clockKid','だるまの時計（子ども役のとき）',20,90,1,'秒'],['clockDaruma','だるまの時計（だるま役のとき）',20,90,1,'秒'],
  ['knock','だるまの前で捕まったら下がる（遠いほど少なく、スタートで0.4倍。96でスタートへ）',0,96,1,''],
  ['breakMin','ひと休み（いちばん短い）',0,5,0.1,'秒'],['breakMax','ひと休み（いちばん長い）',0,8,0.1,'秒'],
  ['cue','「すぅ…」の合図',0,2,0.1,'秒前'],['watch','振り向いて見ている時間',0.3,3,0.1,'秒']];
// 前の最初の値（下がる量40・25・20）のまま覚えていたら、新しい最初の値にする
const saved=store.get('dk-tune3',{});if([40,25,20].includes(saved.knock))delete saved.knock;if([0.1,0.2].includes(saved.grace))delete saved.grace;for(const [k,olds] of Object.entries({accT:[0.33,1.5],stopT:[0.5],cpuAccT:[1.5],cpuStopMin:[0.4],cpuStopMax:[0.7]}))if(olds.includes(saved[k]))delete saved[k];if([41,42,44].includes(saved.clockDaruma))delete saved.clockDaruma;if(saved.clockKid===40)delete saved.clockKid;
let T={...TUNE_DEF,...saved};
function applyTune(){R.LOOK.grace=Math.round(T.grace*10);R.LOOK.ticks=Math.max(R.LOOK.grace+1,Math.round(T.watch*10));P.GOAL_TICKS=Math.round((role==='daruma'?T.clockDaruma:T.clockKid)*1000/P.TICK_MS);P.CATCH_KNOCK=T.knock>=96?null:T.knock;if(me)R.setMe(me,T.accT,T.stopT);renderCtl()}

const q=new URLSearchParams(location.search);
// 「⚙ 調整」は ?debug をつけたときだけ（遊ぶ人には出さない）
if(q.has('debug'))$('tuneBtn').hidden=false;
let role=q.get('role')||store.get('dk-role','kid');if(role!=='daruma')role='kid';
let pickedType='normal';
let st=null,me=null,cpu=null,phase='setup',paused=false;
// 時間はゲームの中の時計（gt, ミリ秒）で進める。中断している間は止まる
let gt=0,acc=0,lastNow=performance.now(),timers=[],prev=null,prevAt=0,faceAt=-1e9,push=null;
const caughtAt={};
let meCaughtN=0;   // このゲームで自分（人の子）が見つかった回数。結果のシェアに使う
function later(ms,fn){timers.push({at:gt+ms,fn})}

// ---------- 画面の部品 ----------
function renderSetup(){
  $('roles').innerHTML=[['kid',L('子どもで遊ぶ','Play as a runner')],['daruma',L('だるまで遊ぶ','Play as the Daruma')]].map(([k,l])=>`<button class="pill${k===role?' on':''}" data-r="${k}" type="button">${l}</button>`).join('');
  $('roles').querySelectorAll('button').forEach(b=>b.onclick=()=>{role=b.dataset.r;store.set('dk-role',role);renderSetup();if(phase==='setup')$('overP').textContent=HOW[role]});
  $('types').hidden=role!=='daruma'||!q.has('debug');   // だるまの種類は、まだ ?debug のときだけ（初めての人には意味が分からない）
  $('types').innerHTML=Object.keys(P.DARUMA_TYPES).map(k=>`<button class="pill${k===pickedType?' on':''}" data-t="${k}" type="button" title="${TYPE_NOTE[k]||''}">${P.DARUMA_TYPES[k].label}</button>`).join('');
  $('types').querySelectorAll('button').forEach(b=>b.onclick=()=>{pickedType=b.dataset.t;renderSetup()});
}
// 中身が変わったときだけ描き直す。0.1 秒ごとに描き直すと、押してから離すまでの間に中身が入れかわって、
// 押したことが無視される（唱えている間に振り向くボタンが切りかわらなかった、2026-10-20）
function setHTML(el,h){if(el._h!==h){el._h=h;el.innerHTML=h}}
function renderCtl(){
  if(!st)return;
  renderClock();

  if(role!=='daruma')return;
  const prep=phase==='prep';
  setHTML($('lvRow'),LV_ORDER.map(t=>`<button class="btn lv${st.reward===t?' on':''}${st.nextReward===t?' next':''}" data-r="${t}" style="--c:${TIER_COL[t]}" type="button">${LV_NAME[t]}<small>${L('見送り','Pass ')}+${Math.round(P.REWARD[t].reward*st.type.skipRewardScale)}<br>${L('振向','Turn ')}−${Math.round(Core.turnCostOf(P,st,t))}</small></button>`).join(''));
  const cost=Math.round(Core.turnCostOf(P,st)),afford=st.stamina>=cost;
  // 気力が足りないときは、どちらを選んでも見送りになるので、押せない灰色にして理由を出す（押しても見た目が変わらず、壊れたように見えていた）
  $('arm').disabled=!afford;$('arm').classList.toggle('on',st.turnArmed&&afford);
  const gain=Math.round(Core.currentSkipReward(P,st));
  setHTML($('arm'),EN?(!afford?`🙈 Not enough spirit: pass<small>${st.reward==='low'?'Pass to recover spirit':'A stronger aura lets you turn'} (spirit +${gain})</small>`:st.turnArmed?`👀 Turn when the chant ends<small>spirit -${cost}</small>`:`🙈 Let it pass<small>spirit +${gain}</small>`)
    :!afford?`🙈 気力が足りないので見送り<small>${st.reward==='low'?'見送って気力をためよう':'オーラを強くすると振り向ける'}（気力+${gain}）</small>`:st.turnArmed?`👀 唱え終わったら振り向く<small>気力 -${cost}</small>`:`🙈 振り向かずに見送る<small>気力 +${gain}</small>`);
  $('go').disabled=!prep||paused;
  $('tempo').value=Math.round(st.tempoValue);$('tempoTxt').textContent=tempoName(st.tempoValue)+(phase==='chant'?L('（上げると気力を使う）',' (raising it costs spirit)'):'');

  $('lvNote').textContent=prep?'':st.nextReward?L('唱え終わりで変わる','changes when the chant ends'):L('押すと予約','tap to reserve');
}
// だるまの時計を描く。唱えている間だけ進むので、それ以外は「止まってる」
function renderClock(){
  const el=$('clock');if(!st||phase==='setup'){el.hidden=true;return}el.hidden=false;
  const left=Math.max(0,(P.GOAL_TICKS-st.elapsedTicks)*P.TICK_MS/1000);
  // 練習中も本番と同じ秒数を出す（進まないだけ）。前は「練習中」と出していて、時計の説明のときに分かりにくかった
  const full=(role==='daruma'?T.clockDaruma:T.clockKid);
  $('clockNum').firstChild.nodeValue=(tut?full:left).toFixed(1);
  $('clockBar').style.width=tut?'100%':(100*left/(P.GOAL_TICKS*P.TICK_MS/1000))+'%';
  el.classList.toggle('stop',tut||phase!=='chant');$('clockLbl').textContent=tut?L('練習中は進まない','paused in practice'):phase==='chant'?L('だるまの時計',"Daruma's clock"):L('時計は止まってる','clock stopped');el.classList.toggle('low',!tut&&left<=10);el.classList.toggle('panic',!tut&&left<=5&&phase==='chant');
}
function renderChant(){const el=$('chant');el.classList.toggle('look',phase==='look'||phase==='push');
  if(phase==='prep'||phase==='cue'){el.innerHTML=`<span class="said">${phase==='cue'?L('すぅ…','Ready…'):L('ひと休み','Break')}</span>`;return}
  const n=phase==='push'?10:st?R.said(st):0;el.innerHTML=(EN?CHANT_EN:Core.CHANT_CHARS).map((s,k)=>`<span class="${k<n?'said':''}">${s}</span>`).join('')}
let msgT=0;function showMsg(s,ms,sub){const m=$('msg');m.textContent=s;if(sub){const e=document.createElement('small');e.textContent=sub;m.appendChild(e)}m.hidden=false;clearTimeout(msgT);msgT=setTimeout(()=>m.hidden=true,ms||1100)}
function log(s){$('log').insertAdjacentHTML('afterbegin',`<div>${s}</div>`)}
function setPaused(s){$('paused').textContent=s||'';$('paused').hidden=!s}
let pausedNote='';
function note(s){pausedNote=s||'';setPaused(paused?L('中断中（⏸ をもう一度で再開）','Paused (press ⏸ again to resume)'):pausedNote)}

// ---------- 音 ----------
let actx=null;
function ac(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}return actx}
function beep(f,d,type='triangle'){const a=actx;if(!a)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.12,n);g.gain.exponentialRampToValueAtTime(0.0001,n+d);o.connect(g).connect(a.destination);o.start(n);o.stop(n+d+0.02)}

// ---------- 進める ----------
function start(){
  $('overP').classList.remove('lines');$('roles').hidden=false;ac();timers=[];acc=0;paused=false;
  const nk=tut?(role==='kid'?1:3):P.ACTIVE_CHILDREN;
  st=R.newGame({withMe:role==='kid',kids:nk,lane:nk-1,type:role==='daruma'?pickedType:'normal',accT:T.accT,stopT:T.stopT,cpuStop:[T.cpuStopMin,Math.max(T.cpuStopMin,T.cpuStopMax)],cpuAccT:T.cpuAccT});
  let ci=0;st.children.forEach((c,i)=>{c.lane=i;c.col=c.human?null:KID_COL[ci++]});
  me=st.children.find(c=>c.human)||null;cpu=role==='kid'?R.cpuDaruma():null;
  applyTune();if(tut)P.GOAL_TICKS=1e7;

    cx.font=`900 ${Math.max(13,dr*0.5)}px ${css('--pop')}`;cx.fillText(LV_NAME[st.reward],dx-dr*1.2,dy+dr*0.35);

    const cost=Core.turnCostOf(P,st),bw=dr*2.2,bx=dx-bw/2,by=yT+6,bh=Math.max(12,dr*0.26),rr=bh/2;
    cx.fillStyle=SC.card;cx.beginPath();cx.roundRect(bx,by,bw,bh,rr);cx.fill();
    const f=Math.min(1,st.stamina/st.staminaMax);
    if(f>0){cx.save();cx.beginPath();cx.roundRect(bx,by,bw,bh,rr);cx.clip();cx.fillStyle=st.stamina>=cost?'#3fae4f':muted;cx.fillRect(bx,by,bw*f,bh);cx.restore()}
    cx.strokeStyle=ink;cx.lineWidth=2;cx.beginPath();cx.roundRect(bx,by,bw,bh,rr);cx.stroke();
    cx.textAlign='center';cx.fillStyle=ink;cx.font=`900 ${Math.max(11,dr*0.36)}px ${css('--ui')}`;
    // 数字はだるまにだけ（子どもには、振り向きや見送りで増減する量が見えないので、数字だけあっても読めない）
    const qt=st.stamina<cost?L('気力が足りない','Low spirit'):role==='daruma'?`${L('気力','Spirit')} ${Math.round(st.stamina)}`:L('気力','Spirit'),qw=cx.measureText(qt).width;   // ボードの右はしで切れないように
    cx.fillText(qt,Math.min(dx,W-6-qw/2),by+bh+Math.max(13,dr*0.42));
  }
  drawDaruma(dx,dy,dr);
  if(st&&cpu&&$('showMind').checked&&st.cpuThought&&(phase==='chant'||phase==='look')){
    cx.font=`900 ${Math.max(10,dr*0.34)}px ${css('--ui')}`;cx.textAlign='right';cx.fillStyle=ink;cx.fillText(st.cpuThought,dx-dr*1.2,dy+dr*0.95)}
  if(!st)return;
  // 子ども（奥から順に。奥ほど上で小さく、手前ほど下で大きい）
  const moving=phase==='chant'||phase==='look',u=moving?Math.min(1,(gt-prevAt)/P.TICK_MS):1,n=st.children.length,mind=$('showMind').checked;
  // 「あなた」はいつも一番手前の列に描く（奥にいると、上に出る「見送り！」などが自分のことに見えた）。並びは絵だけで、中身の順は変えない
  //   1人だけ（あそびかた）のときも手前に
  const order=st.children.map((c,i)=>i).sort((a,b)=>(st.children[a].human?1:0)-(st.children[b].human?1:0));
  const tags=[];
  order.forEach((i,li)=>{const c=st.children[i],row=n===1?1:li;
    let pos=(prev?prev[i]:c.pos)+(c.pos-(prev?prev[i]:c.pos))*u;
    const hit=caughtAt[c.id]!=null&&(phase==='look'||phase==='push')&&caughtAt[c.id]>=faceAt;
    if(push&&push.dur){const k=Math.min(1,(gt-push.t0)/push.dur),e=1-Math.pow(1-k,3);pos=push.from[i]+(push.to[i]-push.from[i])*e}
    // 前の子ども役と同じ：足は地面の帯の上。奥（i=0）ほど上で小さく、手前ほど下で大きい
    const s=Math.min(H*0.075,W*0.05)*(0.8+0.15*row*2/Math.max(1,n-1)),y=gy+6+row*(H-gy-12)/(Math.max(1,n-1)*1.1),col=c.human?accent:c.col;
    // 見つかった直後はビクッと震える
    const x=X(pos)+(hit&&gt-caughtAt[c.id]<350?Math.sin((gt-caughtAt[c.id])/18)*s*0.15:0);
    // すべった跡：振り向いたところから、見つかったところまで（押し戻されている間も残す）
    if(hit&&st.look){const xa=X(st.look.from[i]),xb=X(push&&push.dur?push.from[i]:c.pos);cx.strokeStyle=red;cx.lineWidth=Math.max(2,s*0.15);cx.setLineDash([s*0.3,s*0.25]);cx.beginPath();cx.moveTo(xa,y+3);cx.lineTo(xb,y+3);cx.stroke();cx.setLineDash([])}
    cx.globalAlpha=1;
    // 走り方が見て分かるように（2026-10-18）：全力は前かがみで大またに、土ぼこり。小走りはまっすぐ小さく。
    //   歩くはゆっくり。ブレーキは体をそらして踏んばり、足もとにすべった跡。だるまからも同じに見える
    const f=c.vel/c.maxSpeed,mv=(moving||phase==='push')&&c.vel>0.01,g=mv?gaitOf(c,i):'止まってる';
    const lean=g==='全力'?0.28:g==='小走り'?0.1:g==='ブレーキ'?-0.22:0;
    const amp=g==='全力'?0.95:g==='小走り'?0.6:g==='歩く'?0.35:g==='ブレーキ'?0.15:0;
    const leg=mv?Math.sin(pos*(g==='全力'?1.6:2.4))*amp:0;
    if(g==='全力'){ // 土ぼこり（後ろに流れる）
      for(let k=0;k<3;k++){const t=((gt/260+k/3+i*0.17)%1),px=x-s*(0.5+t*1.6),py=y-s*(0.1+t*0.5);
        cx.globalAlpha=(1-t)*0.45;cx.fillStyle=muted;cx.beginPath();cx.arc(px,py,s*(0.15+t*0.25),0,7);cx.fill()}cx.globalAlpha=1}
    if(g==='ブレーキ'){const kk=!!c.boosting;cx.strokeStyle=kk?red:muted;cx.lineWidth=Math.max(1.5,s*(kk?0.16:0.1));cx.beginPath();cx.moveTo(x-s*(kk?2.6:1.2),y+1);cx.lineTo(x+s*0.3,y+1);cx.stroke()
      // 急ブレーキ（ダッシュで止まる）：前の足もとから土がパッパッと前へ飛ぶ（2026-10-24。前は名前の上に「キキッ！」と出していた）
      if(kk){for(let k=0;k<4;k++){const t=(gt/170+k/4)%1,px=x+s*(0.35+t*1.2),py=y-s*(0.1+t*(1-t)*1.6);
        cx.globalAlpha=(1-t)*0.7;cx.fillStyle=k%2?muted:'#b98a5e';cx.beginPath();cx.arc(px,py,s*(0.1+t*0.14),0,7);cx.fill()}cx.globalAlpha=1}}
    cx.save();cx.translate(x,y);cx.rotate(lean);cx.translate(-x,-y);
    drawPicto(x,y,s,col,pictoPose(g,hit,mv?pos*(g==="全力"?1.6:g==="小走り"?2.2:2.6):0),hit);
    cx.restore();
    cx.globalAlpha=1;
    // 名前と「！」は、みんなを描いたあとにいちばん上へ（頭が大きいので、後ろの列の子の頭にかくれないように）。白いふちで読めるように
    const label=(c.human?L('あなた','You'):EN?nm(c):c.name.replace(/^.*の/,''))+(c.winded?L(' ぜぇ…',' pant…'):'');
    //   名前は頭の上ではなく、頭の後ろ（左）に右寄せで置く（列の間がせまく、上に置くと後ろの列の子の頭にかかる）
    tags.push(()=>{cx.textAlign='right';cx.lineJoin='round';cx.strokeStyle=SC.card;
      cx.font=`700 ${Math.max(c.human?11:10,s*(c.human?0.6:0.5))}px ${css('--ui')}`;cx.lineWidth=3;const lx=x-s*0.75,ly=y-s*2.55;cx.strokeText(label,lx,ly);
      cx.fillStyle=c.human?ink:muted;cx.fillText(label,lx,ly);cx.textAlign='center';
      if(hit){cx.font=`900 ${Math.max(14,s*1.1)}px ${css('--pop')}`;cx.lineWidth=4;cx.strokeText('！',x,y-s*3.7-Math.max(12,s*0.7));cx.fillStyle=red;cx.fillText('！',x,y-s*3.7-Math.max(12,s*0.7))}});

    if(mind||c.human){const bw=s*1.6,bx=x-bw/2,by=y+5;cx.fillStyle=SC.line;cx.fillRect(bx,by,bw,3);cx.fillStyle=c.winded?red:accent;cx.fillRect(bx,by,bw*c.energy/c.energyMax,3)}
    if(mind&&!c.human){const m=[gaitOf(c,i),c.intendsToStop===false?'賭け':''].filter(Boolean).join('・');if(m)tags.push(()=>{cx.textAlign='center';cx.fillStyle=c.intendsToStop===false?red:ink;cx.font=`900 ${Math.max(9,s*0.48)}px ${css('--ui')}`;cx.fillText(m,x,y-s*3.7-Math.max(11,s*0.6))})}
  });
  tags.forEach(f=>f());
  $('gauge').style.width=`calc((100% - 24px) * ${me?Math.min(1,me.vel/me.maxSpeed):0})`;
}

// ---------- 背景：神社の境内（2026-10-25） ----------
// 遠くの山・地平線の森・奥の鳥居と石灯籠。遊ぶ場所（地面）より奥なので、色は淡く、子どもやだるまより目立たないように
function drawBackdrop(gy){
  // 遠くの山
  cx.fillStyle='#cfe8dc';
  for(const [k,w,h] of [[0.12,0.34,0.3],[0.58,0.4,0.22],[0.97,0.3,0.34]]){cx.beginPath();cx.ellipse(W*k,gy,W*w,gy*h,0,Math.PI,0);cx.fill()}
  // 鳥居（まん中の奥）
  const th=Math.min(gy*0.5,W*0.2),tw=th*0.95,tx=W*0.5,   // 縦長のスマホでは鳥居が大きくなりすぎないよう、横幅でもおさえる
tb=gy+2,pil=tw*0.075,red='#e0553e',dark='#3b2a22';
  cx.fillStyle=red;
  for(const s of[-1,1])cx.fillRect(tx+s*tw*0.33-pil/2,tb-th*0.86,pil,th*0.86);       // 柱
  cx.fillRect(tx-tw*0.46,tb-th*0.66,tw*0.92,th*0.06);                                 // 貫（下の横木）
  cx.fillRect(tx-pil*0.4,tb-th*0.86,pil*0.8,th*0.2);                                  // 額束
  cx.beginPath();cx.moveTo(tx-tw*0.56,tb-th*0.96);cx.quadraticCurveTo(tx,tb-th*0.88,tx+tw*0.56,tb-th*0.96);  // 笠木（上の横木。両はしが反る）
  cx.lineTo(tx+tw*0.53,tb-th*0.86);cx.quadraticCurveTo(tx,tb-th*0.8,tx-tw*0.53,tb-th*0.86);cx.closePath();cx.fill();
  cx.fillStyle=dark;cx.beginPath();cx.moveTo(tx-tw*0.6,tb-th*1.0);cx.quadraticCurveTo(tx,tb-th*0.92,tx+tw*0.6,tb-th*1.0);
  cx.lineTo(tx+tw*0.56,tb-th*0.95);cx.quadraticCurveTo(tx,tb-th*0.875,tx-tw*0.56,tb-th*0.95);cx.closePath();cx.fill();
  // 石灯籠（鳥居の両わき）
  const lh=th*0.36,lw=lh*0.42;
  for(const s of[-1,1]){const lx=tx+s*tw*0.82,b=tb;
    cx.fillStyle='#b9b2a6';cx.fillRect(lx-lw*0.5,b-lh*0.12,lw,lh*0.12);cx.fillRect(lx-lw*0.14,b-lh*0.55,lw*0.28,lh*0.45);
    cx.fillRect(lx-lw*0.38,b-lh*0.78,lw*0.76,lh*0.24);
    cx.fillStyle='#fff2c4';cx.fillRect(lx-lw*0.16,b-lh*0.74,lw*0.32,lh*0.16);
    cx.fillStyle='#a39b8e';cx.beginPath();cx.moveTo(lx-lw*0.62,b-lh*0.78);cx.lineTo(lx,b-lh*1.0);cx.lineTo(lx+lw*0.62,b-lh*0.78);cx.closePath();cx.fill()}
  // 地平線の森（いつも同じ形。sin でばらつかせる）
  const step=Math.max(18,W*0.045);
  for(const [c,dy,sc] of [['#9fd09a',0.06,1],['#7dbb79',0,0.8]]){cx.fillStyle=c;
    for(let x=-step;x<W+step;x+=step){const k=x/step,r=gy*(0.06+0.03*Math.abs(Math.sin(k*1.9+sc*3)))*sc;
      if(Math.abs(x-tx)<tw*0.75)continue;   // 鳥居の前はあける
      cx.beginPath();cx.arc(x,gy-r*0.5-gy*dy,r,0,7);cx.fill()}}
}

// ---------- だるま（2026-10-25） ----------
// 下がふくらんだ形。唱えている間は背中（金の「福」）を向けて小さく揺れ、振り向くと顔が横から回ってくる（0.2 秒）。
// 顔は白地に太い眉・ぎょろ目・ひげ、まわりを金でふちどる。見つけた直後は目が赤く光る
function darumaPath(x,y,w,h){
  cx.beginPath();cx.moveTo(x,y-h);
  cx.bezierCurveTo(x+w*0.6,y-h,x+w*0.92,y-h*0.42,x+w,y+h*0.32);
  cx.bezierCurveTo(x+w*1.04,y+h*0.86,x+w*0.6,y+h,x,y+h);
  cx.bezierCurveTo(x-w*0.6,y+h,x-w*1.04,y+h*0.86,x-w,y+h*0.32);
  cx.bezierCurveTo(x-w*0.92,y-h*0.42,x-w*0.6,y-h,x,y-h);cx.closePath();
}
function drawDaruma(x,y,r){
  const w=r*0.98,h=r*1.1,ink='#2a1610',gold='#f2b632',gold2='#c98a12';
  const faceOn=phase==='look'||phase==='push';
  // 足もとの影
  cx.fillStyle='rgba(74,47,34,.22)';cx.beginPath();cx.ellipse(x,y+h*0.98,w*0.85,h*0.12,0,0,7);cx.fill();
  cx.save();
  // 唱えている間は、ゆらゆら（だるまらしく、下を支点に）
  if(phase==='chant'){const a=Math.sin(gt/260)*0.045;cx.translate(x,y+h);cx.rotate(a);cx.translate(-x,-(y+h))}
  // 胴：左上が明るい赤
  darumaPath(x,y,w,h);
  const g=cx.createRadialGradient(x-w*0.35,y-h*0.45,r*0.1,x,y,r*1.35);g.addColorStop(0,'#ff6b4f');g.addColorStop(0.55,'#dd3322');g.addColorStop(1,'#9c1d10');
  cx.fillStyle=g;cx.fill();cx.lineWidth=Math.max(1.5,r*0.05);cx.strokeStyle='#7a150b';cx.stroke();
  cx.save();darumaPath(x,y,w,h);cx.clip();
  // すそを金の帯で
  cx.strokeStyle=gold;cx.lineWidth=r*0.09;cx.beginPath();cx.ellipse(x,y+h*1.02,w*0.95,h*0.32,0,Math.PI*1.05,Math.PI*1.95);cx.stroke();
  // つやの光
  cx.fillStyle='rgba(255,255,255,.28)';cx.beginPath();cx.ellipse(x-w*0.45,y-h*0.42,w*0.16,h*0.3,0.5,0,7);cx.fill();
  if(!faceOn){
    // 背中：金の丸に「福」
    const ey=y+h*0.18,er=r*0.36;
    cx.fillStyle=gold;cx.beginPath();cx.arc(x,ey,er,0,7);cx.fill();
    cx.strokeStyle=gold2;cx.lineWidth=r*0.04;cx.stroke();
    cx.fillStyle='#b8231a';cx.font=`900 ${er*1.25}px ${css('--pop')}`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('福',x,ey+er*0.06);cx.textBaseline='alphabetic';
  }else{
    // 顔（横から回ってくる）。子どもは左にいるので、顔は少し左寄り
    const f=Math.min(1,(gt-faceAt)/200),fx=x+w*0.65*(1-f)-w*0.1*f,sx=0.2+0.8*f,fy=y-h*0.3;
    cx.translate(fx,0);cx.scale(sx,1);cx.translate(-fx,0);
    // おなかに金の「福」
    cx.fillStyle=gold;cx.font=`900 ${r*0.42}px ${css('--pop')}`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('福',fx,y+h*0.5);cx.textBaseline='alphabetic';
    // 白い顔と金のふち
    const fw=w*0.62,fh=h*0.46;
    cx.fillStyle='#fff8ec';cx.beginPath();cx.ellipse(fx,fy,fw,fh,0,0,7);cx.fill();
    cx.strokeStyle=gold;cx.lineWidth=r*0.07;cx.stroke();
    // 見ている間は、目が子どもを見回す。見つけた直後は赤く光る
    const look=phase==='look'?Math.sin((gt-faceAt)/180)*r*0.05:0;
    const angry=Object.values(caughtAt).some(t=>t>=faceAt&&gt-t<800);
    for(const s of[-1,1]){
      const ex=fx+s*fw*0.42,eyy=fy-fh*0.05;
      cx.fillStyle='#fff';cx.strokeStyle=ink;cx.lineWidth=r*0.035;cx.beginPath();cx.ellipse(ex,eyy,r*0.17,r*0.15,0,0,7);cx.fill();cx.stroke();
      cx.fillStyle=angry?'#e0402c':ink;cx.beginPath();cx.arc(ex-r*0.04+look,eyy,r*0.085,0,7);cx.fill();
      if(angry){cx.save();cx.shadowColor='#ff3b1f';cx.shadowBlur=r*0.4;cx.beginPath();cx.arc(ex-r*0.04+look,eyy,r*0.06,0,7);cx.fill();cx.restore()}
      cx.fillStyle='#fff';cx.beginPath();cx.arc(ex-r*0.07+look,eyy-r*0.04,r*0.025,0,7);cx.fill();
      // 太い眉（鶴）：外へはね上がる
      cx.strokeStyle=ink;cx.lineWidth=r*0.09;cx.lineCap='round';cx.beginPath();
      cx.moveTo(ex-s*r*0.14,eyy-r*0.2);cx.quadraticCurveTo(ex,eyy-r*(angry?0.22:0.34),ex+s*r*0.24,eyy-r*0.36);cx.stroke();
    }
    // 鼻と、くるっと巻いたひげ（亀）
    cx.fillStyle='#e9b7a0';cx.beginPath();cx.ellipse(fx,fy+fh*0.22,r*0.07,r*0.05,0,0,7);cx.fill();
    cx.strokeStyle=ink;cx.lineWidth=r*0.06;
    for(const s of[-1,1]){cx.beginPath();cx.moveTo(fx,fy+fh*0.36);cx.quadraticCurveTo(fx+s*r*0.18,fy+fh*0.3,fx+s*r*0.3,fy+fh*0.48);cx.quadraticCurveTo(fx+s*r*0.36,fy+fh*0.6,fx+s*r*0.26,fy+fh*0.6);cx.stroke()}
    // あごひげ
    cx.lineWidth=r*0.04;for(const k of[-1,0,1]){cx.beginPath();cx.moveTo(fx+k*r*0.1,fy+fh*0.7);cx.lineTo(fx+k*r*0.12,fy+fh*0.88);cx.stroke()}
  }
  cx.restore();cx.restore();
}

// ---------- ピクトグラムの人（2026-10-19、非常口のマークのような） ----------
// 角度は、まっすぐ下が 0、走る向き（右）がプラス（度）。ももとすね、二の腕と前腕で、ひざとひじが曲がる
const D2R=Math.PI/180;
function pictoPose(g,hit,ph){
  if(hit)return{legs:[[6,6],[-6,-6]],arms:[[115,150],[-115,-150]],bob:0};                 // 見つかった：両手を上げる（大きい頭にかくれないよう、横に広げてバンザイ）
  if(g==='ブレーキ')return{legs:[[38,30],[-8,-14]],arms:[[95,70],[60,40]],bob:0};          // 前の足をつっぱって踏んばる
  const A={全力:[55,105,70,95],小走り:[32,65,42,80],歩く:[18,28,20,30]}[g];
  if(!A)return{legs:[[5,5],[-5,-5]],arms:[[12,12],[-12,-12]],bob:0};                        // 止まっている
  const [At,Kb,Aa,Ke]=A,leg=q=>{const th=At*Math.sin(q);return[th,th-Kb*(0.5-0.5*Math.sin(q))]};
  const arm=q=>{const ua=-Aa*Math.sin(q);return[ua,ua+Ke]};
  return{legs:[leg(ph),leg(ph+Math.PI)],arms:[arm(ph),arm(ph+Math.PI)],bob:Math.abs(Math.sin(ph))*(At/55)*0.12};
}
let PICTO_GAP='#fff';const PICTO_EDGE=0.11;   // 白い縁の太さ（両側あわせて、体の太さの単位で）
// 色を暗く（f は 0〜1、大きいほど暗い）。ズボンや髪の影に使う
function shade(hex,f){const n=parseInt(hex.slice(1),16),c=k=>Math.round(((n>>k)&255)*(1-f));return `rgb(${c(16)},${c(8)},${c(0)})`}
// 子ども（2026-10-25）：頭の大きいちびキャラ。手足の動き（pose）は前のピクトグラムと同じ。
//   シャツは子どもの色、ズボンはその暗い色、手と顔は肌色。目は走る向き（右）を見る。見つかったときは目を丸くして口を「お」に
function drawPicto(x,y,u,col,pose,hit){PICTO_GAP=SC.card;
  const LEG=0.66,TOR=0.72,UA=0.46,FA=0.44,HR=0.62,SKIN='#ffd8b5',HAIR='#4a2f22',pants=shade(col,0.35);
  const hipY=y-u*(1.3+pose.bob),hip=[x,hipY],neck=[x+u*0.03,hipY-u*TOR];
  const seg=(p,a,L)=>[p[0]+Math.sin(a*D2R)*L,p[1]+Math.cos(a*D2R)*L];
  cx.lineCap='round';cx.lineJoin='round';
  // gap：手前の手足のまわりに明るいすき間（重なっても腕と胴が分かれて見える）
  const limb=(p,[a1,a2],L1,L2,w,c,gap,hand)=>{const k=seg(p,a1,L1),e=seg(k,a2,L2),path=()=>{cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(k[0],k[1]);cx.lineTo(e[0],e[1])};
    if(gap){cx.strokeStyle=PICTO_GAP;cx.lineWidth=u*(w+PICTO_EDGE);path();cx.stroke()}
    cx.strokeStyle=c;cx.lineWidth=u*w;path();cx.stroke();
    if(hand){cx.fillStyle=SKIN;cx.beginPath();cx.arc(e[0],e[1],u*w*0.62,0,7);cx.fill()}};
  const armP=[neck[0],neck[1]+u*0.14],head=[neck[0]+u*0.06,neck[1]-u*(HR-0.04)];
  // まず全体のふちを白で（奥の手足 → 胴 → 頭）
  limb(hip,pose.legs[1],u*LEG,u*LEG,0.34,PICTO_GAP,true);limb(armP,pose.arms[1],u*UA,u*FA,0.28,PICTO_GAP,true);
  cx.strokeStyle=PICTO_GAP;cx.lineWidth=u*(0.7+PICTO_EDGE);cx.beginPath();cx.moveTo(hip[0],hip[1]);cx.lineTo(neck[0],neck[1]);cx.stroke();
  cx.fillStyle=PICTO_GAP;cx.beginPath();cx.arc(head[0],head[1],u*(HR+PICTO_EDGE/2),0,7);cx.fill();
  // 奥の手足（少し暗く）→ 胴（シャツ）→ 手前の手足 → 頭
  limb(hip,pose.legs[1],u*LEG,u*LEG,0.34,shade(col,0.48));limb(armP,pose.arms[1],u*UA,u*FA,0.28,shade(col,0.15),false,true);
  cx.strokeStyle=pants;cx.lineWidth=u*0.66;cx.beginPath();cx.moveTo(hip[0],hip[1]);cx.lineTo(hip[0],hip[1]-u*0.12);cx.stroke();
  cx.strokeStyle=col;cx.lineWidth=u*0.7;cx.beginPath();cx.moveTo(hip[0],hip[1]-u*0.14);cx.lineTo(neck[0],neck[1]);cx.stroke();
  limb(hip,pose.legs[0],u*LEG,u*LEG,0.34,pants,true);limb(armP,pose.arms[0],u*UA,u*FA,0.28,col,true,true);
  // 頭：肌色の丸に、後ろから上をおおう髪
  const [hx,hy]=head,R=u*HR;
  cx.fillStyle=SKIN;cx.beginPath();cx.arc(hx,hy,R,0,7);cx.fill();
  cx.fillStyle=HAIR;cx.beginPath();cx.arc(hx,hy,R,Math.PI*0.62,Math.PI*1.93);cx.quadraticCurveTo(hx+R*0.25,hy-R*0.35,hx-R*0.15,hy-R*0.1);cx.closePath();cx.fill();
  // 顔：右を見る。ほっぺ
  const ex=hx+R*0.42,ey=hy+R*0.08;
  cx.fillStyle='rgba(255,120,120,.45)';cx.beginPath();cx.arc(hx+R*0.3,hy+R*0.42,R*0.16,0,7);cx.fill();
  cx.fillStyle=HAIR;
  if(hit){cx.strokeStyle=HAIR;cx.lineWidth=R*0.09;cx.fillStyle='#fff';cx.beginPath();cx.arc(ex,ey,R*0.2,0,7);cx.fill();cx.stroke();
    cx.fillStyle=HAIR;cx.beginPath();cx.arc(ex+R*0.04,ey,R*0.08,0,7);cx.fill();
    cx.beginPath();cx.ellipse(hx+R*0.5,hy+R*0.5,R*0.1,R*0.13,0,0,7);cx.fill()}
  else{cx.beginPath();cx.ellipse(ex,ey,R*0.1,R*0.15,0,0,7);cx.fill();
    cx.strokeStyle=HAIR;cx.lineWidth=R*0.08;cx.beginPath();cx.arc(hx+R*0.5,hy+R*0.42,R*0.14,0.1,Math.PI*0.8);cx.stroke()}
}

// ---------- まわす ----------
function frame(now){
  const dt=Math.min(100,now-lastNow);lastNow=now;
  if(window.DARUMA_ONLINE)gt+=dt;   // みんなで遊ぶとき：ゲームはサーバーが進める。ここでは見た目の時間だけ進める（online.js）
  else if(!paused&&!(tut&&tut.hold)&&st&&phase!=='over'&&phase!=='setup'){
    gt+=dt;
    for(let k=0;k<timers.length;k++){if(gt>=timers[k].at){const f=timers[k].fn;timers.splice(k--,1);f()}}
    if(phase==='chant'||phase==='look'){acc+=dt;while(acc>=P.TICK_MS&&(phase==='chant'||phase==='look')&&!(tut&&tut.hold)){acc-=P.TICK_MS;if(phase==='chant')tick();else lookTick()}}
  }
  draw(now);requestAnimationFrame(frame);
}
renderTune();resize();renderSetup();$('overP').textContent=HOW[role];renderChant();requestAnimationFrame(frame);
</script>

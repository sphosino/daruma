<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>だるまさん みんなで（通信の試作）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Mochiy+Pop+One&display=swap">
<style>
/* みんなで遊ぶ、だるまさんがころんだの通信の試作。上に部屋・だるまの操作、まん中に道、下に子どもの操作パッド。また遊ぼの見た目 */
:root{
  --bg:#fff7ec; --card:#fffdf9; --ink:#4a2f22; --muted:#8f6b58; --line:#f1dcc6; --accent:#c2601a; --on:#ffe2bd;
  --red:#d8452f; --ground:#e9d2b0; --sky:#fff1dc; --ok:#23944a;
  --k1:#4f8fd8; --k2:#3aa65a; --k3:#b45cc8;
  --ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif; --pop:"Mochiy Pop One","Zen Maru Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-weight:500;padding:10px 16px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:100%}
h1{font-family:var(--pop);font-weight:400;font-size:1.1rem;margin:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.btn{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.on{background:var(--on);border-color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1 1 auto}
.note{font-size:.82rem;color:var(--muted);margin:0}
.seat{display:flex;gap:8px;align-items:center}.seat .dot{width:12px;height:12px;border-radius:50%}
input{font:inherit;border:2px solid var(--line);border-radius:10px;padding:7px 9px;min-width:0;flex:1}
.chant{font-family:var(--pop);font-size:clamp(1.3rem,6vw,2rem);text-align:center;min-height:1.4em;white-space:nowrap}
.chant span{color:var(--line)}.chant span.said{color:var(--ink)}.chant.look{color:var(--red)}
.stage{position:relative;height:42vh;min-height:180px;border-radius:16px;overflow:hidden;background:var(--sky);border:2px solid var(--line)}
canvas{display:block;width:100%;height:100%}
.msg{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-family:var(--pop);font-size:clamp(1.2rem,6vw,2rem);color:var(--red);text-shadow:0 2px 0 var(--card);white-space:nowrap;pointer-events:none}
.pad{flex:1 1 26%;min-height:130px;border-radius:20px;border:3px solid var(--accent);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none;font-family:var(--pop);font-size:1.3rem;color:var(--accent)}
.pad.down{background:var(--on)}
.pad small{font-family:var(--ui);font-weight:700;font-size:.8rem;color:var(--muted)}
.hud{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.hud b{color:var(--ink)}
.log{font-size:.78rem;color:var(--muted);max-height:5.5em;overflow:auto}
</style>
</head>
<body>
<div class="app">
  <h1>だるまさん みんなで（通信の試作）</h1>
  <section class="card" id="lobby"></section>
  <section id="game" hidden style="display:flex;flex-direction:column;gap:8px">
    <div class="chant" id="chant"></div>
    <div class="stage"><canvas id="cv"></canvas><div class="msg" id="msg" hidden></div></div>
    <div class="hud"><span>だるまの時計 <b id="clockTxt">0.0</b> / 40秒</span><span>遅れ <b id="rtt">—</b></span><span id="lagTxt"></span></div>
    <div class="card" id="darumaCtl" hidden>
      <div class="row" id="tempo"><button class="btn" data-g="0.40">ゆっくり</button><button class="btn on" data-g="0.27">ふつう</button><button class="btn" data-g="0.17">はやい</button></div>
      <div class="row"><button class="btn on" id="resv">振り向く予約：する</button><button class="btn primary" id="goBtn">言い始める</button></div>
      <p class="note">言っている間も「振り向く予約」を切りかえられます。言い終わった瞬間の予約で決まります。</p>
    </div>
    <div class="pad" id="pad" hidden><span>押して走る</span><small>押しっぱなしで走る・離して止まる</small></div>
    <div class="card"><div class="log" id="log"></div></div>
  </section>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const Q=new URLSearchParams(location.search);
const API=location.hostname==='mataasobo.com'||Q.has('prod')?'https://api.mataasobo.com':'http://127.0.0.1:8787';
const ROOMID=(Q.get('room')||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const LAG=Math.max(0,+Q.get('lag')||0); // 試すとき：片道この分だけわざと遅らせる（ミリ秒）
const SYL=['だ','る','ま','さ','ん','が','こ','ろ','ん','だ'];
const KC=['','--k1','--k2','--k3'];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- 子どもの動き（サーバーの daruma-room.js と同じ式） ----------
let RULE={RUN:{vmax:10,acc:30,dec:40},L:100,TOUCH:96};
function advance(s,t){const dt=(t-s.t)/1000;if(dt<=0)return s;let{x,v}=s;const R=RULE.RUN;
  if(s.p){const ta=Math.min(dt,Math.max(0,(R.vmax-v)/R.acc));x+=v*ta+0.5*R.acc*ta*ta;v=Math.min(R.vmax,v+R.acc*ta);x+=v*(dt-ta)}
  else{const td=Math.min(dt,v/R.dec);x+=v*td-0.5*R.dec*td*td;v=Math.max(0,v-R.dec*td)}
  return{x:Math.min(RULE.L,x),v,p:s.p,t}}
function stateAt(k,t){let s=k.base;for(const e of k.ev){if(e.at>t)break;s={...advance(s,e.at),p:e.p}}return advance(s,t)}

// ---------- このブラウザの番号と名前 ----------
const ABC='abcdefghjkmnpqrstuvwxyz23456789';
function me(){let p=null;try{p=localStorage.getItem('mataasobo-pid')}catch(e){}
  if(!/^[a-z0-9]{16,40}$/.test(p||'')){p=Array.from(crypto.getRandomValues(new Uint8Array(24)),b=>ABC[b%ABC.length]).join('');try{localStorage.setItem('mataasobo-pid',p)}catch(e){}}return p}
// 同じパソコンで2つ開いて試せるように、?as=2 などで別の人になれる
const PID=Q.get('as')?me().slice(0,20)+'x'+Q.get('as').replace(/[^a-z0-9]/g,''):me();
const myName=()=>{try{return localStorage.getItem('mataasobo-name')||''}catch(e){return ''}};

// ---------- 通信（LAG で遅れをまねできる） ----------
let ws=null,RV=null,offset=0,rtt=null;
const later=(f)=>LAG?setTimeout(f,LAG):f();
function send(m){const s=JSON.stringify(m);later(()=>{if(ws&&ws.readyState===1)ws.send(s)})}
const serverNow=()=>performance.now()+offset;
function connect(){
  ws=new WebSocket(API.replace(/^http/,'ws')+'/rooms/'+ROOMID+'/ws?pid='+PID);
  ws.onmessage=e=>{if(e.data==='pong')return;const m=JSON.parse(e.data);later(()=>onMsg(m))};
  ws.onopen=()=>{sync();for(let i=1;i<5;i++)setTimeout(sync,i*300)};
  ws.onclose=()=>setTimeout(connect,1500);
}
// 時計合わせ：行って帰ってきた時間の半分を、片道の遅れとみなす。いちばん速く帰ってきたものを使う
let bestRtt=Infinity;
function sync(){send({t:'sync',c:performance.now()})}
setInterval(sync,2000);setInterval(()=>{if(ws&&ws.readyState===1)ws.send('ping')},20000);
function onMsg(m){
  if(m.t==='sync'){const now=performance.now(),r=now-m.c;rtt=r;if(r<=bestRtt*1.2){bestRtt=Math.min(bestRtt,r);offset=m.s-(m.c+r/2)}$('rtt').textContent=Math.round(r)+'ms';return}
  if(m.t==='err'){log('⚠ '+m.msg);return}
  if(!m.room)return;
  RV=m.room;if(RV.rule)RULE=RV.rule;
  ackPending();
  const ev=m.event;
  if(ev){
    if(ev.cue){showMsg('すぅ…',900);cueAt=ev.cue}
    if(ev.chant){chantStart(ev.chant)}
    if(ev.syl){shownSyl=ev.syl}
    if(ev.turn){shownSyl=10;showMsg('見てる！',1500)}
    if(ev.skip){shownSyl=0;log('見送り（振り向かなかった）');if(RV.you===0)chantStart(ev.skip)}
    if(ev.judged){const c=ev.judged;log(c.length?'アウト：'+c.map(x=>`${name(x.i)}（振り向いたとき 速さ${x.v}）`).join('・'):'振り向いた：みんなセーフ');if(c.some(x=>x.i===RV.you))showMsg('アウト！ 下がる',1300)}
    if(ev.rest){shownSyl=0;showMsg('ひと休み',900)}
    if(ev.touch){log('タッチ！ 子どもの勝ち');showMsg('タッチ！',2000)}
    if(ev.timeup){log('40秒たった！ だるまの勝ち');showMsg('だるまの勝ち',2000)}
  }
  draw();
}
const name=i=>RV.seats[i]&&RV.seats[i].name||'？';

// ---------- 自分の入力（子ども）：押した瞬間に自分の画面で動かす ----------
let pending=[]; // 送ったけれど、まだサーバーの様子に入っていない入力
function ackPending(){const k=RV&&RV.kids&&RV.kids[RV.you];if(!k){pending=[];return}
  const last=k.ev.length?k.ev[k.ev.length-1].at:k.base.t;pending=pending.filter(e=>e.at>last+1&&serverNow()-e.at<800)}
function input(p){if(!RV||RV.you<1||!RV.kids)return;const at=serverNow();pending.push({at,p});send({t:'in',p,at});$('pad').classList.toggle('down',p)}
function myKid(){const k=RV.kids[RV.you];if(!k)return null;if(!pending.length)return k;
  // サーバーの様子に、まだ届いていない自分の入力を足す（ただし動けるのは言っている間だけ）
  return RV.phase==='chant'?{base:k.base,ev:[...k.ev,...pending].sort((a,b)=>a.at-b.at),caught:k.caught}:k}
const pad=$('pad');
pad.addEventListener('pointerdown',e=>{e.preventDefault();try{pad.setPointerCapture(e.pointerId)}catch(_){}input(true)});
pad.addEventListener('pointerup',()=>input(false));pad.addEventListener('pointercancel',()=>input(false));
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();input(true)}});
addEventListener('keyup',e=>{if(e.code==='Space')input(false)});

// ---------- だるま：言う ----------
let gap=0.27,resv=true,shownSyl=0,cueAt=0,chantTimer=null;
document.querySelectorAll('#tempo .btn').forEach(b=>b.onclick=()=>{gap=+b.dataset.g;document.querySelectorAll('#tempo .btn').forEach(x=>x.classList.toggle('on',x===b))});
$('resv').onclick=()=>{resv=!resv;$('resv').textContent='振り向く予約：'+(resv?'する':'しない（見送る）');$('resv').classList.toggle('on',resv)};
$('goBtn').onclick=()=>send({t:'go'});
function chantStart(at){
  if(RV.you!==0)return;clearTimeout(chantTimer);let i=0;
  const next=()=>{i++;shownSyl=i;send(i<10?{t:'syl',i}:{t:'syl',i,turn:resv});draw();if(i<10)chantTimer=setTimeout(next,gap*1000*(0.85+Math.random()*0.3))};
  chantTimer=setTimeout(next,gap*1000);
}

// ---------- 画面 ----------
let msgT=0;function showMsg(s,ms){const m=$('msg');m.textContent=s;m.hidden=false;clearTimeout(msgT);msgT=setTimeout(()=>m.hidden=true,ms)}
function log(s){const l=$('log');l.insertAdjacentHTML('afterbegin',`<div>${esc(s)}</div>`)}
const cv=$('cv'),cx=cv.getContext('2d');let W=0,H=0;
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);
function frame(){
  if(RV&&RV.phase!=='lobby'&&RV.kids){
    cx.clearRect(0,0,W,H);const gy=H*0.62,left=W*0.06,right=W*0.84,X=x=>left+(right-left)*x/RULE.L,now=serverNow();
    cx.fillStyle=css('--ground');cx.fillRect(0,gy,W,H-gy);
    const dx=W*0.91,dr=Math.min(H*0.16,W*0.07),dy=gy-dr*1.1,look=RV.phase==='watch';
    cx.fillStyle=css('--red');cx.beginPath();cx.ellipse(dx,dy,dr*0.95,dr*1.1,0,0,7);cx.fill();
    if(look){cx.fillStyle=css('--card');cx.beginPath();cx.ellipse(dx-dr*0.12,dy-dr*0.2,dr*0.55,dr*0.5,0,0,7);cx.fill();cx.fillStyle=css('--ink');for(const s of[-1,1]){cx.beginPath();cx.arc(dx-dr*0.12+s*dr*0.22,dy-dr*0.25,dr*0.1,0,7);cx.fill()}}
    cx.font=`700 ${Math.max(10,dr*0.4)}px ${css('--ui')}`;cx.textAlign='center';cx.fillStyle=css('--ink');cx.fillText(name(0),dx,gy+16);
    RV.kids.forEach((k0,i)=>{if(!k0)return;const k=i===RV.you?myKid():k0;const st=stateAt(k,now),lane=i-1;
      const s=Math.min(H*0.07,W*0.045),y=gy+8+lane*(H-gy-16)/2.4,x=X(st.x),col=css(KC[i]),caught=k.caught>now;
      cx.globalAlpha=caught?0.35:1;const leg=st.v>0.3?Math.sin(st.x*2.4)*0.6:0;
      cx.strokeStyle=col;cx.lineWidth=s*0.28;cx.lineCap='round';for(const g of[1,-1]){cx.beginPath();cx.moveTo(x,y-s*0.9);cx.lineTo(x+Math.sin(leg*g)*s*0.7,y);cx.stroke()}
      cx.fillStyle=col;cx.beginPath();cx.ellipse(x,y-s*1.5,s*0.55,s*0.75,0,0,7);cx.fill();cx.fillStyle=css('--card');cx.beginPath();cx.arc(x,y-s*2.55,s*0.48,0,7);cx.fill();cx.strokeStyle=col;cx.lineWidth=s*0.12;cx.stroke();
      cx.globalAlpha=1;cx.fillStyle=i===RV.you?css('--ink'):css('--muted');cx.font=`700 ${Math.max(10,s*0.55)}px ${css('--ui')}`;cx.fillText(name(i)+(i===RV.you?'（あなた）':''),x,y-s*3.3)});
    const tot=RV.chantTotal+(RV.phase==='chant'&&RV.chantFrom?now-RV.chantFrom:0);$('clockTxt').textContent=(tot/1000).toFixed(1);
  }
  requestAnimationFrame(frame)}
function draw(){
  const inGame=RV&&RV.phase!=='lobby';renderLobby();$('game').hidden=!inGame;if(!inGame)return;
  const el=$('chant');el.classList.toggle('look',RV.phase==='watch');
  el.innerHTML=RV.phase==='break'?'<span class="said">ひと休み</span>':RV.phase==='cue'?'<span class="said">すぅ…</span>':RV.phase==='over'?`<span class="said">${RV.winner==='kids'?'子どもの勝ち':'だるまの勝ち'}</span>`:SYL.map((s,k)=>`<span class="${k<shownSyl?'said':''}">${s}</span>`).join('');
  $('darumaCtl').hidden=RV.you!==0;$('pad').hidden=!(RV.you>0);
  $('goBtn').disabled=RV.phase!=='break';
  $('lagTxt').textContent=LAG?`わざと片道${LAG}msの遅れ`:'';
  if(!W)resize();
}
function renderLobby(){
  const el=$('lobby');
  if(!ROOMID){el.innerHTML='<p class="note">だるま役が部屋を作って、子ども役にリンクを送ります（通信の試作なので、強気度・気力・CPU の子どもはまだありません）。</p><button class="btn primary" id="mk">部屋を作る（だるま役）</button>';
    $('mk').onclick=async()=>{const r=await fetch(API+'/rooms',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pid:PID,name:myName()||'だるま',kind:'daruma'})});const j=await r.json();location.search='?room='+j.id+(LAG?'&lag='+LAG:'')+(Q.get('as')?'&as='+Q.get('as'):'')+(Q.has('prod')?'&prod':'')};return}
  if(!RV){el.innerHTML='<p class="note">つないでいます…</p>';return}
  const lobby=RV.phase==='lobby'||RV.phase==='over',you=RV.you;el.hidden=!lobby;if(!lobby)return;
  const url=location.origin+location.pathname+'?room='+RV.id;
  const h=`<b>${RV.phase==='over'?(RV.winner==='kids'?'子どもの勝ち！':'だるまの勝ち！')+` （だるま${RV.wins[0]}勝・子ども${RV.wins[1]}勝）`:'⏳ 集まっています'}</b>
    ${RV.seats.map((s,i)=>`<div class="seat"><span class="dot" style="background:var(${i?KC[i]:'--red'})"></span>${i?'子ども':'だるま'}：${s.empty?'あき':esc(s.name)+(i===you?'（あなた）':'')}${s.empty?'':s.online?' ●':' （るす）'}</div>`).join('')}
    <div class="row"><input id="inv" readonly value="${esc(url)}"><button class="btn" id="cp">コピー</button></div>
    ${you<0?'<input id="nm" placeholder="名前" value="'+esc(myName())+'"><button class="btn primary" id="jn">子どもで参加する</button>':''}
    ${you===0?'<button class="btn primary" id="st">はじめる</button>':you>0?'<p class="note">だるまが「はじめる」を押すのを待っています</p>':''}`;
  if(el.dataset.h===h)return;el.dataset.h=h;el.innerHTML=h;
  const on=(id,f)=>{const b=$(id);if(b)b.onclick=f};
  on('cp',()=>{$('inv').select();navigator.clipboard&&navigator.clipboard.writeText(url).catch(()=>{})});
  on('jn',()=>{const v=($('nm').value||'').trim()||'こども';try{localStorage.setItem('mataasobo-name',v)}catch(e){}send({t:'join',name:v})});
  on('st',()=>send({t:'start'}));
}
resize();requestAnimationFrame(frame);
if(ROOMID)connect();
draw();
</script>
</body>
</html>

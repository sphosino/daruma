<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>だるまさん だるま役の試作</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Mochiy+Pop+One&display=swap">
<style>
/* だるま役で、CPU の子ども4人を読み切る。子どもの AI は old/daruma-core.js（前のだるまで作りこんだもの）をそのまま使う
   見た目は子ども役の試作（index.html）にそろえる：上に言葉、まん中に道、下にだるまの操作 */
:root{
  --bg:#fff7ec; --card:#fffdf9; --ink:#4a2f22; --muted:#8f6b58; --line:#f1dcc6; --accent:#c2601a; --on:#ffe2bd;
  --red:#d8452f; --ground:#e9d2b0; --sky:#fff1dc;
  --ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif; --pop:"Mochiy Pop One","Zen Maru Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-weight:500;padding:10px 16px;-webkit-user-select:none;user-select:none}
.app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
h1{font-family:var(--pop);font-weight:400;font-size:1.05rem;margin:0}
.chant{font-family:var(--pop);font-size:clamp(1.3rem,6vw,2rem);text-align:center;min-height:1.4em;white-space:nowrap}
.chant span{color:var(--line)}.chant span.said{color:var(--ink)}.chant.look{color:var(--red)}
.stage{position:relative;height:38vh;min-height:170px;border-radius:16px;overflow:hidden;background:var(--sky);border:2px solid var(--line)}
canvas{display:block;width:100%;height:100%}
.msg{position:absolute;left:50%;top:12%;transform:translateX(-50%);font-family:var(--pop);font-size:clamp(1.1rem,5.5vw,1.8rem);color:var(--red);text-shadow:0 2px 0 var(--card);white-space:nowrap;pointer-events:none}
.paused{position:absolute;inset:auto 0 8px 0;text-align:center;font-size:.8rem;color:var(--muted);pointer-events:none}
.hud{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hud b{color:var(--ink)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lbl{font-size:.8rem;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.row{display:flex;gap:6px}.row>*{flex:1 1 0;min-width:0}
.btn{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 6px;cursor:pointer;line-height:1.3}
.btn small{display:block;font-size:.68rem;font-weight:500;color:var(--muted)}
.btn.on{background:var(--on);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card);font-family:var(--pop);font-weight:400;font-size:1.1rem}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lv{--c:var(--line)}.lv.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
input[type=range]{width:100%;accent-color:var(--accent)}
.arm.on{background:var(--on);border-color:var(--red)}
.log{font-size:.78rem;color:var(--muted);max-height:6em;overflow:auto}
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:color-mix(in srgb,var(--bg) 86%,transparent);text-align:center;padding:12px}
.over h2{font-family:var(--pop);font-weight:400;margin:0;font-size:1.5rem}
.over p{margin:0;font-size:.88rem;color:var(--muted);max-width:30em}
.types{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.types .btn{flex:0 1 auto;padding:6px 12px}
</style>
</head>
<body>
<div class="app">
  <h1>だるまさん だるま役の試作 <a href="./" style="font-family:var(--ui);font-size:.8rem;color:var(--accent);margin-left:8px">子ども役で遊ぶ →</a></h1>
  <div class="chant" id="chant"></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="msg" id="msg" hidden></div>
    <div class="paused" id="paused" hidden>時間は止まっている。今のうちに作戦を立てよう</div>
    <div class="over" id="over">
      <h2>だるまさんがころんだ</h2>
      <p>あなたはだるま。CPU の子ども4人が、だるまにタッチしようと走ってきます。言い終わったときに動いていた子をスタートに戻して、40秒（言っている時間だけ数える）耐えたら勝ち。</p>
      <div class="types" id="types"></div>
      <p id="typeNote"></p>
      <button class="btn primary" id="startBtn" type="button">はじめる</button>
    </div>
  </div>
  <div class="hud"><span>のこり <b id="left">40.0</b>秒</span><span><b id="cycle">1</b>回目</span><span>気力 <b id="qi">—</b></span></div>
  <div class="card" id="ctl">
    <div><div class="lbl"><span>強気度（言う前か、見送った直後に決める）</span><span id="lvNote"></span></div>
      <div class="row" id="lvRow"></div></div>
    <div><div class="lbl"><span>テンポ</span><span id="tempoTxt"></span></div>
      <input type="range" id="tempo" min="0" max="100" step="1" value="45" aria-label="テンポ"></div>
    <div class="row"><button class="btn arm on" id="arm" type="button"></button><button class="btn primary" id="go" type="button">言い始める</button></div>
  </div>
  <div class="card"><div class="log" id="log"></div></div>
</div>
<script src="old/daruma-core.js"></script>
<script>
'use strict';
const Core=window.DarumaCore,P=Core.makeConfig({}); // 調整ラボの値は使わない（いつも同じ決まりで）
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const LV_WIN=1000; // 見送ったあと、強気度を選び直せる時間（ミリ秒）。言う速さで忙しさが変わらないよう時間で決める
const TIERS=['low','mid','high','max'],TIER_COL={low:'#4f8fd8',mid:'#e5b830',high:'#ef8a2c',max:'#e0402c'},PULSE={low:0.6,mid:1,high:1.6,max:2.6};
const KID_COL=['#4f8fd8','#3aa65a','#b45cc8','#e0457b'];
const TYPE_NOTE={normal:'クセなし。まずはこれで。',red:'気力の器が大きいぶん、見送っても実入りが細い。',oni:'振り向きが安い。そのかわりテンポを上げるのが高い。子どもに怖がられている。',attack:'テンポが安い。そのかわり振り向きが高い。子どもに舐められている。'};
let st=null,phase='setup',loop=null,lvUntil=0,lvT=0,pickedType='normal',prev=null,prevAt=0,tickAt=0,faceUntil=0;
const caughtAt={};

// ---------- 画面の部品 ----------
function renderTypes(){$('types').innerHTML=Object.keys(P.DARUMA_TYPES).map(k=>`<button class="btn${k===pickedType?' on':''}" data-t="${k}" type="button">${P.DARUMA_TYPES[k].label}</button>`).join('');
  $('typeNote').textContent=TYPE_NOTE[pickedType]||'';$('types').querySelectorAll('button').forEach(b=>b.onclick=()=>{pickedType=b.dataset.t;renderTypes()})}
function renderCtl(){
  if(!st)return;const prep=phase==='prep',lvOpen=prep||(phase==='chant'&&performance.now()<lvUntil);
  $('lvRow').innerHTML=TIERS.map(t=>`<button class="btn lv${st.reward===t?' on':''}" data-r="${t}" style="--c:${TIER_COL[t]}" type="button"${lvOpen?'':' disabled'}>${P.REWARD[t].label}<small>見送り+${Math.round(P.REWARD[t].reward*st.type.skipRewardScale)}<br>振向−${Math.round(Core.turnCostOf(P,st,t))}</small></button>`).join('');
  $('lvRow').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!(phase==='prep'||(phase==='chant'&&performance.now()<lvUntil)))return;st.reward=b.dataset.r;renderCtl()});
  const cost=Math.round(Core.turnCostOf(P,st)),afford=st.stamina>=cost;
  $('arm').classList.toggle('on',st.turnArmed);
  $('arm').innerHTML=st.turnArmed?`👀 言い終わったら振り向く<small>気力 -${cost}${afford?'':'（足りない）'}</small>`:`🙈 振り向かずに見送る<small>気力 +${Math.round(Core.currentSkipReward(P,st))}</small>`;
  $('go').disabled=!prep;$('paused').hidden=!(prep&&st.cycle>1);
  $('tempo').value=Math.round(st.tempoValue);$('tempoTxt').textContent=Core.tempoLabel(st.tempoValue)+(phase==='chant'?'（上げると気力を使う）':'');
  $('qi').textContent=`${Math.round(st.stamina)} / ${Math.round(st.staminaMax)}`;
  $('left').textContent=Math.max(0,(P.GOAL_TICKS-st.elapsedTicks)*P.TICK_MS/1000).toFixed(1);$('cycle').textContent=st.cycle;
  $('lvNote').textContent=prep?'':lvOpen?'今だけ変えられる！':'言っている間は変えられない';
}
function renderChant(){const el=$('chant');const look=performance.now()<faceUntil;el.classList.toggle('look',look);
  if(phase==='prep'&&st&&st.cycle>1){el.innerHTML='<span class="said">ひと休み</span>';return}
  const n=st?Math.min(10,Math.floor(st.chantProgress/10)):0;el.innerHTML=Core.CHANT_CHARS.map((s,k)=>`<span class="${k<n?'said':''}">${s}</span>`).join('')}
let msgT=0;function showMsg(s,ms){const m=$('msg');m.textContent=s;m.hidden=false;clearTimeout(msgT);msgT=setTimeout(()=>m.hidden=true,ms)}
function log(s){$('log').insertAdjacentHTML('afterbegin',`<div>${s}</div>`)}

// ---------- 進める ----------
function start(){
  st=Core.newRunState(P,Core.pickActiveChildren(P,P.ACTIVE_CHILDREN),pickedType);
  st.children.forEach((c,i)=>{c.lane=i;c.col=KID_COL[i]});st.turnArmed=true;st.reward='mid';
  $('over').hidden=true;$('log').innerHTML='';prev=snap();prevAt=tickAt=performance.now();toPrep();
  log(`${st.type.label}で始めた。子ども：${st.children.map(c=>c.name).join('・')}`);
}
const snap=()=>st.children.map(c=>c.pos);
function toPrep(){phase='prep';clearInterval(loop);loop=null;st.turnArmed=true;renderCtl();renderChant()}
function toChant(){phase='chant';renderCtl();loop=setInterval(tick,P.TICK_MS)}
function tick(){
  prev=snap();prevAt=performance.now();
  const res=Core.tick(P,st);tickAt=performance.now();
  renderCtl();renderChant();
  if(res.reached){end(false,res.reached);return}
  if(res.timeUp){end(true);return}
  if(res.chantDone){clearInterval(loop);loop=null;resolve()}
}
function resolve(){
  const cost=Math.round(Core.turnCostOf(P,st)),cyc=st.cycle;
  const out=Core.resolveCycle(P,st);
  if(out.turned){faceUntil=performance.now()+1200;showMsg(out.caught.length?'見た！ '+out.caught.map(c=>c.name).join('・'):'見た！ …みんな止まってた',1200);
    out.caught.forEach(c=>caughtAt[c.id]=performance.now());
    log(`${cyc}回目：振り向いた（気力-${cost}）`+(out.caught.length?` → ${out.caught.map(c=>c.name).join('・')} をスタートへ`:' → 誰も動いてなかった'))}
  else if(out.underpowered){showMsg('力が足りない…',1000);log(`${cyc}回目：振り向こうとしたが、気力が足りなかった`)}
  else{
    // 見送り：止まらずに続ける。最後の「だ」が次の「だ」を兼ねる。振り向く／見送るの選びは前のまま。
    //   強気度はここから LV_WIN の間だけ選び直せる
    log(`${cyc}回目：見送った（気力+${Math.round(out.gained)}）`);showMsg('見送り！',800);
    st.chantProgress=10;st.turnArmed=false;lvUntil=performance.now()+LV_WIN;
    clearTimeout(lvT);lvT=setTimeout(renderCtl,LV_WIN+20);
    prev=snap();prevAt=tickAt=performance.now();toChant();renderChant();return}
  prev=snap();prevAt=tickAt=performance.now();
  setTimeout(toPrep,out.turned?1200:300);phase='wait';renderCtl();
}
function end(win,kid){clearInterval(loop);loop=null;phase='over';renderCtl();
  const o=$('over');o.querySelector('h2').textContent=win?'だるまの勝ち！':`${kid.name}にタッチされた`;
  o.querySelector('p').textContent=win?`40秒耐えきった。${st.cycle}回言って、捕まえたのは${st.catches}回。`:`${st.cycle}回目、のこり${Math.max(0,(P.GOAL_TICKS-st.elapsedTicks)*P.TICK_MS/1000).toFixed(1)}秒だった。捕まえたのは${st.catches}回。`;
  $('startBtn').textContent='もう一回';o.hidden=false;renderTypes()}

$('startBtn').onclick=start;
$('go').onclick=()=>{if(phase==='prep')toChant()};
$('arm').onclick=()=>{if(!st||(phase!=='prep'&&phase!=='chant'))return;st.turnArmed=!st.turnArmed;renderCtl()};
$('tempo').oninput=()=>{if(!st)return;const want=+$('tempo').value;
  if(phase==='chant'){const got=Core.applyTempoChange(P,st,want);if(got!==want)$('tempo').value=got}else st.tempoValue=want;renderCtl()};

// ---------- 描く（0.1秒ごとの位置を、間はなめらかにつなぐ） ----------
const cv=$('cv'),cx=cv.getContext('2d');let W=0,H=0;
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);
function frame(now){
  cx.clearRect(0,0,W,H);const gy=H*0.42,left=W*0.06,right=W*0.84,X=x=>left+(right-left)*x/100;
  cx.fillStyle=css('--ground');cx.fillRect(0,gy,W,H-gy);
  cx.strokeStyle=css('--muted');cx.setLineDash([4,4]);cx.beginPath();cx.moveTo(X(2),gy);cx.lineTo(X(2),H);cx.stroke();cx.setLineDash([]);
  const dx=W*0.91,dr=Math.min(H*0.16,W*0.07),dy=gy-dr*1.1;
  if(st){ // 強気度の光
    const lc=TIER_COL[st.reward],beat=0.5+0.5*Math.sin(now/1000*Math.PI*2*PULSE[st.reward]),ar=dr*(1.35+0.15*TIERS.indexOf(st.reward)+0.12*beat);
    const g=cx.createRadialGradient(dx,dy,dr*0.6,dx,dy,ar);g.addColorStop(0,lc+'cc');g.addColorStop(1,lc+'00');cx.fillStyle=g;cx.beginPath();cx.arc(dx,dy,ar,0,7);cx.fill();
    // 気力のゲージ（黒い線が、今の強気度で振り向くのに要る気力）
    const bw=dr*2,bx=dx-dr,by=gy+8,cost=Core.turnCostOf(P,st);cx.fillStyle=css('--line');cx.fillRect(bx,by,bw,7);
    cx.fillStyle=st.stamina>=cost?lc:css('--muted');cx.fillRect(bx,by,bw*Math.min(1,st.stamina/st.staminaMax),7);
    cx.strokeStyle=css('--ink');cx.lineWidth=1.5;const cxp=bx+bw*Math.min(1,cost/st.staminaMax);cx.beginPath();cx.moveTo(cxp,by-3);cx.lineTo(cxp,by+10);cx.stroke();
  }
  const look=now<faceUntil;cx.fillStyle=css('--red');cx.beginPath();cx.ellipse(dx,dy,dr*0.95,dr*1.1,0,0,7);cx.fill();
  if(look){cx.fillStyle=css('--card');cx.beginPath();cx.ellipse(dx-dr*0.12,dy-dr*0.2,dr*0.55,dr*0.5,0,0,7);cx.fill();cx.fillStyle=css('--ink');for(const s of[-1,1]){cx.beginPath();cx.arc(dx-dr*0.12+s*dr*0.22,dy-dr*0.25,dr*0.1,0,7);cx.fill()}}
  if(st){const u=phase==='chant'?Math.min(1,(now-prevAt)/P.TICK_MS):1;
    st.children.forEach((c,i)=>{// 地面の帯の上に4列。奥（i=0）ほど上で小さい
      const x0=prev?prev[i]:c.pos,pos=x0+(c.pos-x0)*u,lane=(H-gy-14)/4,s=Math.min(lane*0.36,W*0.04)*(0.85+0.1*i),y=gy+lane*(i+0.95),x=X(pos);
      const ca=caughtAt[c.id]&&now-caughtAt[c.id]<700;cx.globalAlpha=ca?0.3:1;
      const mv=c.vel>P.CATCH_VEL_THRESHOLD&&phase==='chant',leg=mv?Math.sin(pos*2.4)*0.6:0;
      cx.strokeStyle=c.col;cx.lineWidth=s*0.28;cx.lineCap='round';for(const g of[1,-1]){cx.beginPath();cx.moveTo(x,y-s*0.9);cx.lineTo(x+Math.sin(leg*g)*s*0.7,y);cx.stroke()}
      cx.fillStyle=c.col;cx.beginPath();cx.ellipse(x,y-s*1.5,s*0.55,s*0.75,0,0,7);cx.fill();cx.fillStyle=css('--card');cx.beginPath();cx.arc(x,y-s*2.55,s*0.48,0,7);cx.fill();cx.strokeStyle=c.col;cx.lineWidth=s*0.12;cx.stroke();
      if(c.winded){cx.fillStyle=css('--muted');cx.font=`700 ${Math.max(9,s*0.55)}px ${css('--ui')}`;cx.textAlign='left';cx.fillText('ぜぇ…',x+s*0.9,y-s*2.6)}
      cx.globalAlpha=1;cx.fillStyle=css('--muted');cx.font=`700 ${Math.max(9,s*0.62)}px ${css('--ui')}`;cx.textAlign='left';cx.fillText(c.name,x+s*0.9,y-s*1.4)})}
  requestAnimationFrame(frame)}
resize();renderTypes();renderChant();requestAnimationFrame(frame);
</script>
</body>
</html>
